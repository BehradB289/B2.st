# ==============================================================================
# B2.st Studio - Optimized Nginx Web Server Configuration
# ==============================================================================

worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # نگاشت صحیح پسوندهای جاوااسکریپت و ماژول‌های ES6
    types {
        application/javascript js mjs;
        application/json json;
        image/png png;
        image/svg+xml svg;
        audio/ogg ogg;
        audio/mpeg mp3;
        text/css css;
        text/html html;
    }

    # لاگ‌های بهینه‌سازی شده در قالب JSON برای رصد بهتر
    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # تنظیمات عملکرد شبکه و I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # فشرده‌سازی داینامیک Gzip برای بارگذاری فوق‌سریع بازی
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # هدرهای امنیتی مطابق با استانداردهای مدرن OWASP
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; audio-src 'self' data: blob:; connect-src 'self'; font-src 'self';" always;

        # نقطه پایانی بررسی سلامت کانتینر
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # متدهای غیرمجاز
        if ($request_method !~ ^(GET|HEAD)$ ) {
            return 405;
        }

        # پیکربندی کش استاتیک برای ماژول‌های ES6 و است‌ها
        location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|ogg|mp3|wav)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
            try_files $uri =404;
        }

        # مسیر روت و وب‌شل بازی
        location / {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri $uri/ /index.html =404;
        }

        # سفارشی‌سازی صفحات خطا
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}