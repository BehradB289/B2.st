worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # استاندارد MIME Type برای ماژول‌های جاوااسکریپت ES6
    types {
        application/javascript js mjs;
        text/css css;
        text/html html htm;
        application/json json;
        image/svg+xml svg;
        image/png png;
        audio/ogg ogg;
        audio/mpeg mp3;
        audio/wav wav;
    }

    # فرمت لاگ بهینه‌شده JSON-like برای تحلیل لاگ‌های پروداکشن
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # فشرده‌سازی GZIP برای دارایی‌های بازی رترو، تایل‌مپ‌ها و اسکریپت‌ها
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # هدرهای امنیتی مطابق چک‌لیست استودیو B2.st
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; audio-src 'self' data: blob:; connect-src 'self';" always;

        # نقطه پایانی بررسی سلامت (Healthcheck) برای Docker و K8s
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # کنترل کش برای ماژول‌های ES6 سورس کد در حالت کش بهینه
        location ^~ /src/ {
            expires 1d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # کش طولانی برای فایل‌های مدیا و فونت‌ها
        location ~* \.(?:ico|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ogg|mp3|wav)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # صفحه اصلی بدون کش جهت اطمینان از دریافت آخرین ورژن چرخه بازی
        location / {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri $uri/ /index.html =404;
        }

        # مدیریت صفحات خطا
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}