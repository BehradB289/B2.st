version: "3.8"

services:
  mario-game:
    build:
      context: .
      dockerfile: Dockerfile
    image: b2st/mario-game:1.0.0
    container_name: b2st-mario-engine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=mario.b2.st
      - LETSENCRYPT_HOST=mario.b2.st
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mario-network

networks:
  mario-network:
    name: b2st-mario-net
    driver: bridge