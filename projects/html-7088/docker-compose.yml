# ==============================================================================
# B2.st Studio - Production Docker Compose Stack
# ==============================================================================
version: '3.8'

services:
  mario-game:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: b2st_mario_web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - b2st_frontend_net

networks:
  b2st_frontend_net:
    name: b2st_mario_network
    driver: bridge