<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario - B2.st Secure Edition</title>
    <!-- Layer 0: Fire-Up RASP Engine before anything else -->
    <script src="src/security/owasp_guard.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 20px;
            background: #11141c;
            color: #f1f1f1;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 12px;
        }
        .header-panel h1 {
            margin: 0 0 6px 0;
            color: #ff3e3e;
            font-size: 24px;
            letter-spacing: 1px;
            text-shadow: 2px 2px #000;
        }
        .shield-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: #0d2618;
            color: #27c960;
            border: 1px solid #27c960;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .game-wrapper {
            position: relative;
            background: #5c94fc;
            border: 4px solid #33394d;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #5c94fc;
        }
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        .control-panel {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            width: 640px;
            max-width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: #1b202e;
            border: 1px solid #3d4663;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.2s border;
        }
        input[type="text"]:focus {
            border-color: #27c960;
        }
        button {
            padding: 10px 18px;
            background: #ff3e3e;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s background;
        }
        button:hover {
            background: #e02a2a;
        }
        .leaderboard-panel {
            margin-top: 15px;
            width: 640px;
            max-width: 100%;
            background: #171b26;
            border: 1px solid #2c3347;
            border-radius: 6px;
            padding: 12px;
        }
        .leaderboard-panel h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #ffaa00;
        }
        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13px;
        }
        .leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #222838;
        }
        .logs-panel {
            margin-top: 10px;
            width: 640px;
            max-width: 100%;
            background: #0d0f14;
            border: 1px solid #1a2030;
            border-radius: 6px;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #a0aec0;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <h1>MARIO BROWSER PLATFORMER</h1>
        <div class="shield-status">
            <span>🛡️ فایروال نرم‌افزاری OWASP فعال است (B2.st Hardened RASP)</span>
        </div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="640" height="360"></canvas>
        <div class="hud">
            <div>سکه: <span id="coinDisplay">0</span></div>
            <div>امتیاز: <span id="scoreDisplay">0</span></div>
            <div>جان: <span id="livesDisplay">3</span></div>
        </div>
    </div>

    <div class="control-panel">
        <input type="text" id="playerNameInput" placeholder="نام بازیکن را وارد کنید (فیلتر آنتی XSS/SQLi)...">
        <button id="saveScoreBtn">ثبت رکورد</button>
    </div>

    <div class="leaderboard-panel">
        <h3>🏆 برترین بازیکنان (رندرسازی ایمن با Context Encoding)</h3>
        <ul class="leaderboard-list" id="leaderboardList">
            <li><span>Mario_Hero</span> <span>1250</span></li>
            <li><span>Luigi_B2</span> <span>980</span></li>
        </ul>
    </div>

    <div class="logs-panel" id="telemetryBox">
        [OWASP_FIREWALL_LOGS] سیستم مانیتورینگ امنیتی لایو آماده است...
    </div>

    <script>
        // ==========================================
        // Safe Architecture Integration with OWASPGuard
        // ==========================================
        const Guard = window.OWASPGuard;
        const memoryVault = Guard.GameMemory;

        // Visual Logger for Telemetry
        function updateTelemetryUI() {
            const logs = Guard.getTelemetry();
            const logBox = document.getElementById('telemetryBox');
            if (logs.length > 0) {
                const latest = logs[0];
                logBox.textContent = `[${latest.timestamp.split('T')[1].split('.')[0]}] [${latest.severity}] ${latest.type}: ${latest.detail}`;
            }
        }

        // ==========================================
        // Mini Mario Engine
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gravity = 0.5;
        const keys = { right: false, left: false, up: false };

        const player = {
            x: 50,
            y: 280,
            width: 24,
            height: 32,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpStrength: -11,
            grounded: false
        };

        const platforms = [
            { x: 0, y: 320, width: 640, height: 40 }, // Ground
            { x: 180, y: 240, width: 100, height: 20 },
            { x: 340, y: 180, width: 120, height: 20 },
            { x: 520, y: 230, width: 80, height: 20 }
        ];

        const coins = [
            { x: 220, y: 200, radius: 8, collected: false },
            { x: 390, y: 140, radius: 8, collected: false },
            { x: 550, y: 190, radius: 8, collected: false }
        ];

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if ((e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') && player.grounded) {
                player.vy = player.jumpStrength;
                player.grounded = false;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        });

        function updatePhysics() {
            // Horizontal motion
            if (keys.right) player.vx = player.speed;
            else if (keys.left) player.vx = -player.speed;
            else player.vx = 0;

            player.x += player.vx;

            // Horizontal bounds
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Vertical motion & gravity
            player.vy += gravity;
            player.y += player.vy;
            player.grounded = false;

            // Platform Collisions
            for (let plat of platforms) {
                if (
                    player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y + player.height <= plat.y + player.vy + 1 &&
                    player.y + player.height + player.vy >= plat.y
                ) {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }

            // Coin Collect with In-Memory Integrity Shield
            for (let coin of coins) {
                if (!coin.collected) {
                    const dx = (player.x + player.width / 2) - coin.x;
                    const dy = (player.y + player.height / 2) - coin.y;
                    if (Math.hypot(dx, dy) < player.width / 2 + coin.radius) {
                        coin.collected = true;
                        // Tamper-proof update through Guard
                        memoryVault.update(state => {
                            state.coins += 1;
                            state.score += 100;
                        });
                        syncHUD();
                    }
                }
            }

            // Fall of Map Protection
            if (player.y > canvas.height) {
                memoryVault.update(state => {
                    state.lives -= 1;
                });
                player.x = 50;
                player.y = 200;
                player.vy = 0;
                syncHUD();
            }
        }

        function syncHUD() {
            const data = memoryVault.read();
            document.getElementById('coinDisplay').textContent = data.coins;
            document.getElementById('scoreDisplay').textContent = data.score;
            document.getElementById('livesDisplay').textContent = data.lives;
        }

        function drawGame() {
            // Clear sky
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            ctx.fillStyle = '#a04000';
            for (let plat of platforms) {
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                ctx.fillStyle = '#1e8449';
                ctx.fillRect(plat.x, plat.y, plat.width, 6); // Green top
                ctx.fillStyle = '#a04000';
            }

            // Draw Coins
            for (let coin of coins) {
                if (!coin.collected) {
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fill();
                    ctx.strokeStyle = '#b7950b';
                    ctx.stroke();
                }
            }

            // Draw Mario Character
            ctx.fillStyle = '#e74c3c'; // Mario Red Overalls
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#2980b9'; // Blue shirt
            ctx.fillRect(player.x + 4, player.y + 12, player.width - 8, 12);
            ctx.fillStyle = '#fad7a0'; // Face
            ctx.fillRect(player.x + 4, player.y + 4, player.width - 8, 8);
        }

        function gameLoop() {
            updatePhysics();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // Safe UI Form & Scoreboard Submissions
        // ==========================================
        const nameInput = document.getElementById('playerNameInput');
        const submitBtn = document.getElementById('saveScoreBtn');
        const leaderboardList = document.getElementById('leaderboardList');

        // Bind with OWASP Input Defense
        Guard.attachSafeInputBinder(nameInput, processScoreRecord);

        submitBtn.addEventListener('click', () => {
            processScoreRecord(nameInput.value);
        });

        function processScoreRecord(rawName) {
            // 1. Hardened Anti-SQLi Check
            if (Guard.SQLiShield.isMalicious(rawName)) {
                alert('خطای امنیتی OWASP: عبارت وارد شده شامل الگوهای غیرمجاز پایگاه داده است!');
                updateTelemetryUI();
                return;
            }

            // 2. Anti-XSS Sanitization & Contextual Encoding
            const safeName = Guard.Sanitizer.validateSafeText(rawName || 'بازیکن_ناشناس');
            const currentScore = memoryVault.read().score;

            // 3. Safe Dynamic DOM Construction (Zero innerHTML vulnerability)
            const li = document.createElement('li');
            const nameSpan = document.createElement('span');
            nameSpan.textContent = safeName; // Secure TextNode assignment prevents execution

            const scoreSpan = document.createElement('span');
            scoreSpan.textContent = currentScore.toString();

            li.appendChild(nameSpan);
            li.appendChild(scoreSpan);
            leaderboardList.prepend(li);

            nameInput.value = '';
            updateTelemetryUI();

            // 4. Secure Simulated Network Transmission (Demonstrating Token Protection)
            Guard.TokenVault.setSecureToken('SESSION_USER', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_token');
            
            fetch('/api/submit_score', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + Guard.TokenVault.getSecureToken('SESSION_USER')
                },
                body: JSON.stringify({ player: safeName, score: currentScore })
            }).catch(e => {
                // Network mock will reject or pass cleanly through firewall inspection
                updateTelemetryUI();
            });
        }

        // Boot
        syncHUD();
        gameLoop();
    </script>
</body>
</html>
