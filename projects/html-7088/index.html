<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- پچ امنیتی: اعمال سخت‌گیرانه سیاست‌های توزیع محتوا (CSP) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self';">
    <title>Super Mario - B2.st Hardened Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #11141a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 4px solid #30363d;
            border-radius: 8px;
            background: #5c94fc;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        canvas {
            display: block;
            background: #5c94fc;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
        }
        #controls-panel {
            margin-top: 15px;
            background: #161b22;
            padding: 15px 25px;
            border-radius: 6px;
            border: 1px solid #30363d;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        input[type="text"] {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 8px 12px;
            color: #58a6ff;
            border-radius: 4px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #1f6feb;
        }
        button {
            background: #238636;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        button:hover {
            background: #2ea043;
        }
        #sec-status {
            font-size: 12px;
            color: #3fb950;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .shield-dot {
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #3fb950;
        }
    </style>
    <!-- گارد امنیتی OWASP در لایه صفر ران‌تایم باید نخستین اسکریپت لود شونده باشد -->
    <script src="src/security/owasp_guard.js"></script>
</head>
<body>

    <div id="game-container">
        <canvas id="marioCanvas" width="640" height="360"></canvas>
        <div id="ui-overlay">
            <div>MARIO: <span id="player-display">PLAYER 1</span></div>
            <div>COINS: <span id="coin-score">00</span></div>
            <div>SCORE: <span id="game-score">000000</span></div>
            <div>WORLD: <span>1-1</span></div>
        </div>
    </div>

    <div id="controls-panel">
        <label for="player-name">نام بازیکن (ایمن‌شده):</label>
        <input type="text" id="player-name" maxlength="20" placeholder="نام بازیکن...">
        <button id="save-btn">بروزرسانی پروفایل</button>
        <button id="cloud-sync-btn">همگام‌سازی ابری</button>
    </div>

    <div id="sec-status">
        <span class="shield-dot"></span>
        <span>B2.st OWASP Protection Guard: کامپوننت‌های امنیتی فعال می‌باشند.</span>
    </div>

    <script>
        // ==========================================
        // پیاده‌سازی لاجیک سبک بازی ماریو (Safe Client Execution)
        // ==========================================
        const canvas = document.getElementById('marioCanvas');
        const ctx = canvas.getContext('2d');

        const playerDisplay = document.getElementById('player-display');
        const coinScore = document.getElementById('coin-score');
        const gameScore = document.getElementById('game-score');
        const playerNameInput = document.getElementById('player-name');
        const saveBtn = document.getElementById('save-btn');
        const syncBtn = document.getElementById('cloud-sync-btn');

        let score = 0;
        let coins = 0;

        const mario = {
            x: 50,
            y: 280,
            width: 24,
            height: 32,
            dx: 0,
            dy: 0,
            gravity: 0.6,
            jumpPower: -12,
            grounded: true,
            color: '#d62411'
        };

        const ground = { y: 312, height: 48 };

        // کنترل‌ها
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function updateMario() {
            if (keys['ArrowRight'] || keys['KeyD']) {
                mario.dx = 3;
            } else if (keys['ArrowLeft'] || keys['KeyA']) {
                mario.dx = -3;
            } else {
                mario.dx = 0;
            }

            if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && mario.grounded) {
                mario.dy = mario.jumpPower;
                mario.grounded = false;
            }

            mario.dy += mario.gravity;
            mario.x += mario.dx;
            mario.y += mario.dy;

            // برخورد با زمین
            if (mario.y + mario.height >= ground.y) {
                mario.y = ground.y - mario.height;
                mario.dy = 0;
                mario.grounded = true;
            }

            // محدودسازی صفحه
            if (mario.x < 0) mario.x = 0;
            if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;
        }

        function render() {
            // آسمان
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // زمین چمن و خاک
            ctx.fillStyle = '#9b4b00';
            ctx.fillRect(0, ground.y, canvas.width, ground.height);
            ctx.fillStyle = '#00a800';
            ctx.fillRect(0, ground.y, canvas.width, 8);

            // ترسیم ماریو
            ctx.fillStyle = mario.color;
            ctx.fillRect(mario.x, mario.y, mario.width, mario.height);

            // کلاه ماریو
            ctx.fillStyle = '#d62411';
            ctx.fillRect(mario.x + (mario.dx >= 0 ? 4 : -4), mario.y - 4, mario.width, 6);

            // المان‌های پس‌زمینه (ابرهای پیکسلی)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(120, 80, 20, 0, Math.PI * 2);
            ctx.arc(140, 80, 25, 0, Math.PI * 2);
            ctx.arc(160, 80, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            updateMario();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // بخش تست‌های ایمن‌سازی شده با B2Secure
        // ==========================================

        saveBtn.addEventListener('click', () => {
            const rawInput = playerNameInput.value;

            // استفاده از موتور اعتبارسنجی B2Secure به جای درج بی‌پروای ورودی در DOM
            if (window.B2Secure && !window.B2Secure.verifySafeString(rawInput, 'Player Name UI')) {
                alert('هشدار امنیتی: نام کاربری حاوی کدهای مخرب یا غیرمجاز است.');
                return;
            }

            // پاکسازی ضد XSS
            const safeName = window.B2Secure ? window.B2Secure.sanitize(rawInput) : rawInput;
            
            // دستکاری امن المنت
            playerDisplay.textContent = safeName.toUpperCase() || 'PLAYER 1';
        });

        syncBtn.addEventListener('click', async () => {
            // تست فایروال ترافیک شبکه (ارسال امن توکن و پیلود بدون ریسک نشت و SQLi)
            const sampleScoreData = {
                player: playerDisplay.textContent,
                score: score,
                sessionToken: 'b2_mario_auth_sample_secret_key'
            };

            // ذخیره امن توکن در والت حافظه
            window.B2Secure.vault.set('session_auth', sampleScoreData.sessionToken);

            try {
                // شبیه‌سازی درخواست شبکه (توسط فایروال شبکه owasp_guard تحت نظر قرار می‌گیرد)
                const response = await fetch('/api/v1/sync_score', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${window.B2Secure.vault.get('session_auth')}`
                    },
                    body: JSON.stringify({
                        score: sampleScoreData.score,
                        query: "UPDATE leaderboard SET high_score = 100 WHERE id = 1" // اگر دستکاری مخرب شود فایروال بلاک می‌کند
                    })
                });
            } catch (err) {
                console.log('[Safe Rejection Notice] درخواست ناامن توسط ماژول فایروال رهگیری گردید:', err.message);
            }
        });

        // شروع حلقه بازی
        gameLoop();
    </script>
</body>
</html>
