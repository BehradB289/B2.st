<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- لایه ۶: اعمال CSP سفت‌وسخت و جلوگیری از تزریق منابع خارجی ناامن -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:;">
    <title>سوپر ماریو - نسخه بهینه‌سازی شده B2.st</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0d13;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255, 69, 0, 0.3);
        }
        canvas {
            display: block;
            background-color: #5c94fc;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #222;
            border-radius: 4px;
        }
        #controls-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #1c1f26;
            color: #eee;
            font-size: 13px;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            direction: ltr;
        }
        .btn-ui {
            background: #2b313f;
            border: 1px solid #4f5b72;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: all 0.2s;
        }
        .btn-ui:hover {
            background: #404a60;
            border-color: #6c7d9e;
        }
        #mobile-hud {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 90%;
            justify-content: space-between;
            pointer-events: none;
        }
        .d-pad, .action-pad {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .touch-btn {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(255, 69, 0, 0.5);
            border-color: #ff4500;
        }
        @media (max-width: 768px) {
            #mobile-hud { display: flex; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="marioCanvas" width="640" height="400"></canvas>
    <div id="controls-bar">
        <span>حرکت: کلیدهای جهت‌نما یا A/D | پرش: Space / W | دویدن: Shift</span>
        <div>
            <button class="btn-ui" id="btn-save">بکاپ وضعیت</button>
            <button class="btn-ui" id="btn-load">بازیابی</button>
            <button class="btn-ui" id="btn-sound">صدا: روشن</button>
        </div>
    </div>
</div>

<div id="mobile-hud">
    <div class="d-pad">
        <div class="touch-btn" id="m-left">◀</div>
        <div class="touch-btn" id="m-right">▶</div>
    </div>
    <div class="action-pad">
        <div class="touch-btn" id="m-run">⚡</div>
        <div class="touch-btn" id="m-jump">▲</div>
    </div>
</div>

<!-- بارگذاری ماژول بکاپ ایمن -->
<script src="src/utils/backup.js"></script>

<script>
/**
 * بازی ماریو - استاندارد دفاعی و بهینه‌سازی استودیو B2.st
 * فاقد وابستگی خارجی، ضد افت فریم و مقاوم در برابر نشت حافظه
 */
'use strict';

// -------------------------------------------------------------
// ماژول صوتی سنتزگر 8-Bit بدون فایل خارجی (لایه ۷ امنیت)
// -------------------------------------------------------------
class SoundSynth {
    constructor() {
        this.ctx = null;
        this.muted = false;
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                this.ctx = new AudioCtx();
            }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playJump() {
        if (this.muted || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            const now = this.ctx.currentTime;
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);
        } catch(e) {}
    }

    playCoin() {
        if (this.muted || !this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc1 = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(987.77, now); // B5
            osc1.frequency.setValueAtTime(1318.51, now + 0.08); // E6
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
            osc1.connect(gain);
            gain.connect(this.ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.36);
        } catch(e) {}
    }

    playStomp() {
        if (this.muted || !this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.11);
        } catch(e) {}
    }

    playPowerup() {
        if (this.muted || !this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const notes = [330, 392, 659, 523, 587, 784];
            notes.forEach((freq, idx) => {
                osc.frequency.setValueAtTime(freq, now + idx * 0.04);
            });
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.32);
        } catch(e) {}
    }

    playDie() {
        if (this.muted || !this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.5);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.52);
        } catch(e) {}
    }
}

// -------------------------------------------------------------
// تعریف بلوک‌ها و تایل‌های نقشه
// -------------------------------------------------------------
const TILE_EMPTY = 0;
const TILE_GROUND = 1;
const TILE_BRICK = 2;
const TILE_QUESTION_COIN = 3;
const TILE_QUESTION_MUSHROOM = 4;
const TILE_EMPTY_BLOCK = 5;
const TILE_PIPE_TOP_LEFT = 6;
const TILE_PIPE_TOP_RIGHT = 7;
const TILE_PIPE_BODY_LEFT = 8;
const TILE_PIPE_BODY_RIGHT = 9;
const TILE_FLAG_POLE = 10;
const TILE_FLAG_TOP = 11;

const TILE_SIZE = 32;

// -------------------------------------------------------------
// کلاس اصلی بازی سوپر ماریو (B2.st Hardened Core)
// -------------------------------------------------------------
class SuperMarioEngine {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d', { alpha: false });
        this.sound = new SoundSynth();
        this.backup = new MarioBackupEngine();

        // لایه ۸: جلوگیری از تاری و حفظ وضوح پیکسلی دقیق
        this.ctx.imageSmoothingEnabled = false;

        this.isRunning = false;
        this.lastTime = 0;
        this.cameraX = 0;

        // وضعیت بازیکن و بازی
        this.score = 0;
        this.coins = 0;
        this.lives = 3;
        this.world = '1-1';
        this.timeLeft = 400;
        this.timeAccumulator = 0;
        this.state = 'PLAYING'; // PLAYING, DEAD, CLEARED, GAMEOVER

        this.keys = Object.create(null); // لایه ۵: عدم آلودگی پروتوتایپ

        this.initWorld();
        this.initPlayer();
        this.initEntities();
        this.bindEvents();
    }

    async boot() {
        await this.backup.initialize();
        this.isRunning = true;
        this.lastTime = performance.now();
        requestAnimationFrame(this.mainLoop.bind(this));
    }

    initPlayer() {
        this.player = {
            x: 50,
            y: 280,
            width: 22,
            height: 28,
            vx: 0,
            vy: 0,
            isGrounded: false,
            isJumping: false,
            facingRight: true,
            power: 0, // 0: Normal, 1: Super
            invulnerableTime: 0,
            walkFrame: 0,
            walkTimer: 0
        };
    }

    initWorld() {
        // ایجاد نقشه پایدار جهان ۱-۱
        this.mapWidth = 140;
        this.mapHeight = 13;
        this.map = new Uint8Array(this.mapWidth * this.mapHeight);

        const setTile = (tx, ty, tile) => {
            if (tx >= 0 && tx < this.mapWidth && ty >= 0 && ty < this.mapHeight) {
                this.map[ty * this.mapWidth + tx] = tile;
            }
        };

        // کف زمین
        for (let x = 0; x < this.mapWidth; x++) {
            if ((x >= 28 && x <= 30) || (x >= 84 && x <= 86)) continue; // گودال‌ها
            setTile(x, 11, TILE_GROUND);
            setTile(x, 12, TILE_GROUND);
        }

        // علامت‌های سوال و آجرها
        setTile(12, 8, TILE_QUESTION_COIN);
        setTile(16, 8, TILE_BRICK);
        setTile(17, 8, TILE_QUESTION_MUSHROOM);
        setTile(18, 8, TILE_BRICK);
        setTile(19, 8, TILE_QUESTION_COIN);
        setTile(17, 4, TILE_QUESTION_COIN);

        // لوله‌ها
        const makePipe = (x, height) => {
            for (let h = 0; h < height; h++) {
                const y = 10 - h;
                if (h === height - 1) {
                    setTile(x, y, TILE_PIPE_TOP_LEFT);
                    setTile(x + 1, y, TILE_PIPE_TOP_RIGHT);
                } else {
                    setTile(x, y, TILE_PIPE_BODY_LEFT);
                    setTile(x + 1, y, TILE_PIPE_BODY_RIGHT);
                }
            }
        };

        makePipe(24, 2);
        makePipe(36, 3);
        makePipe(48, 4);
        makePipe(60, 4);

        // بلوک‌های تکمیلی
        for (let x = 68; x <= 74; x++) {
            setTile(x, 8, TILE_BRICK);
        }
        setTile(71, 4, TILE_QUESTION_COIN);

        // پله‌های پایانی
        for (let step = 0; step < 7; step++) {
            for (let y = 10 - step; y <= 10; y++) {
                setTile(100 + step, y, TILE_BRICK);
            }
        }

        // میله پرچم پایان مرحله
        setTile(116, 2, TILE_FLAG_TOP);
        for (let y = 3; y <= 10; y++) {
            setTile(116, y, TILE_FLAG_POLE);
        }
    }

    getTile(tx, ty) {
        if (tx < 0 || tx >= this.mapWidth || ty < 0 || ty >= this.mapHeight) return TILE_EMPTY;
        return this.map[ty * this.mapWidth + tx];
    }

    setTile(tx, ty, tile) {
        if (tx >= 0 && tx < this.mapWidth && ty >= 0 && ty < this.mapHeight) {
            this.map[ty * this.mapWidth + tx] = tile;
        }
    }

    initEntities() {
        this.goombas = [
            { x: 400, y: 320, vx: -40, alive: true, squishTimer: 0 },
            { x: 650, y: 320, vx: -40, alive: true, squishTimer: 0 },
            { x: 900, y: 320, vx: -40, alive: true, squishTimer: 0 },
            { x: 1450, y: 320, vx: -40, alive: true, squishTimer: 0 },
            { x: 1950, y: 320, vx: -40, alive: true, squishTimer: 0 }
        ];
        this.mushrooms = [];
        this.particles = [];
    }

    bindEvents() {
        // لایه ۱: اعتبارسنجی ورودی صفحه کلید
        const onKey = (val) => (e) => {
            this.sound.init(); // لایه ۷: شروع صوت امن
            const k = e.code;
            if (['ArrowLeft', 'KeyA'].includes(k)) this.keys.left = val;
            if (['ArrowRight', 'KeyD'].includes(k)) this.keys.right = val;
            if (['ArrowUp', 'Space', 'KeyW'].includes(k)) this.keys.jump = val;
            if (['ShiftLeft', 'ShiftRight', 'KeyJ'].includes(k)) this.keys.run = val;
        };

        window.addEventListener('keydown', onKey(true), { passive: true });
        window.addEventListener('keyup', onKey(false), { passive: true });

        // پشتیبانی از تاچ در موبایل
        const bindTouch = (id, keyName) => {
            const el = document.getElementById(id);
            if (!el) return;
            const setK = (v) => (e) => {
                e.preventDefault();
                this.sound.init();
                this.keys[keyName] = v;
            };
            el.addEventListener('touchstart', setK(true), { passive: false });
            el.addEventListener('touchend', setK(false), { passive: false });
        };

        bindTouch('m-left', 'left');
        bindTouch('m-right', 'right');
        bindTouch('m-jump', 'jump');
        bindTouch('m-run', 'run');

        // دکمه‌های کنترل نوار وضعیت
        document.getElementById('btn-save')?.addEventListener('click', () => {
            this.backup.save(this.getStateSnapshot()).then(() => alert("وضعیت بازی با امضای دیجیتال ذخیره شد."));
        });

        document.getElementById('btn-load')?.addEventListener('click', async () => {
            const res = await this.backup.loadLatest();
            if (res.success) {
                this.restoreState(res.state);
                alert(`وضعیت بازی با موفقیت از ${res.slot} بازیابی شد.`);
            } else {
                alert("بکاپ معتبری یافت نشد: " + res.reason);
            }
        });

        document.getElementById('btn-sound')?.addEventListener('click', (e) => {
            this.sound.muted = !this.sound.muted;
            e.target.innerText = this.sound.muted ? "صدا: خاموش" : "صدا: روشن";
        });
    }

    getStateSnapshot() {
        return {
            lives: this.lives,
            score: this.score,
            coins: this.coins,
            power: this.player.power,
            playerX: this.player.x,
            playerY: this.player.y,
            world: this.world,
            timeRemaining: this.timeLeft,
            cameraX: this.cameraX
        };
    }

    restoreState(st) {
        if (!st || !st.player) return;
        this.lives = st.player.lives;
        this.score = st.player.score;
        this.coins = st.player.coins;
        this.player.power = st.player.power;
        this.player.x = st.player.x;
        this.player.y = st.player.y;
        this.player.vx = 0;
        this.player.vy = 0;
        this.player.height = this.player.power ? 38 : 28;
        this.cameraX = st.level?.scrollOffset || 0;
        this.timeLeft = st.level?.timeRemaining || 400;
        this.state = 'PLAYING';
    }

    // -------------------------------------------------------------
    // حلقه اصلی و رندر پیوسته (لایه ۲ و ۳: بدون Memory Leak و ضد Tunneling)
    // -------------------------------------------------------------
    mainLoop(now) {
        if (!this.isRunning) return;

        // لایه ۳: Clamping برای جلوگیری از عبور از دیوار در صورت افت فریم
        let dt = (now - this.lastTime) / 1000;
        if (dt > 0.05) dt = 0.05;
        this.lastTime = now;

        this.update(dt);
        this.render();

        requestAnimationFrame(this.mainLoop.bind(this));
    }

    update(dt) {
        if (this.state === 'PLAYING') {
            this.updateTimer(dt);
            this.updatePlayer(dt);
            this.updateEnemies(dt);
            this.updateMushrooms(dt);
            this.updateParticles(dt);
            this.checkLevelBounds();
        } else if (this.state === 'DEAD') {
            this.player.vy += 800 * dt;
            this.player.y += this.player.vy * dt;
            if (this.player.y > 600) {
                this.lives--;
                if (this.lives > 0) {
                    this.resetToCheckpoint();
                } else {
                    this.state = 'GAMEOVER';
                }
            }
        }
    }

    updateTimer(dt) {
        this.timeAccumulator += dt;
        if (this.timeAccumulator >= 1.0) {
            this.timeLeft = Math.max(0, this.timeLeft - 1);
            this.timeAccumulator -= 1.0;
            if (this.timeLeft === 0) {
                this.killPlayer();
            }
        }
    }

    updatePlayer(dt) {
        const p = this.player;

        // شتاب و اصطکاک افقی
        const maxSpeed = this.keys.run ? 240 : 160;
        const accel = 600;
        const friction = 700;

        if (this.keys.left) {
            p.vx = Math.max(p.vx - accel * dt, -maxSpeed);
            p.facingRight = false;
        } else if (this.keys.right) {
            p.vx = Math.min(p.vx + accel * dt, maxSpeed);
            p.facingRight = true;
        } else {
            if (p.vx > 0) p.vx = Math.max(0, p.vx - friction * dt);
            else if (p.vx < 0) p.vx = Math.min(0, p.vx + friction * dt);
        }

        // پرش با فیزیک متغیر وابسته به زمان نگه داشتن کلید
        if (this.keys.jump && p.isGrounded && !p.isJumping) {
            p.vy = -420;
            p.isGrounded = false;
            p.isJumping = true;
            this.sound.playJump();
        }

        if (!this.keys.jump && p.vy < -180) {
            p.vy = -180; // کاهش پرش در صورت رها کردن دکمه
        }

        // گرانش
        p.vy += 980 * dt;
        if (p.vy > 650) p.vy = 650;

        // حل تصادمات افقی و عمودی با الگوریتم AABB Sub-stepping
        this.resolvePlayerPhysics(dt);

        // به‌روزرسانی انیمیشن راه رفتن
        if (p.isGrounded && Math.abs(p.vx) > 10) {
            p.walkTimer += dt * (Math.abs(p.vx) / 10);
            if (p.walkTimer > 1) {
                p.walkFrame = (p.walkFrame + 1) % 3;
                p.walkTimer = 0;
            }
        } else {
            p.walkFrame = 0;
        }

        if (p.invulnerableTime > 0) {
            p.invulnerableTime -= dt;
        }

        // هدایت دوربین
        const targetCamX = p.x - 200;
        if (targetCamX > this.cameraX) {
            this.cameraX = targetCamX;
        }
    }

    resolvePlayerPhysics(dt) {
        const p = this.player;

        // حرکت در راستای X
        p.x += p.vx * dt;
        this.checkTileCollision(true);

        // حرکت در راستای Y
        p.y += p.vy * dt;
        p.isGrounded = false;
        this.checkTileCollision(false);
    }

    checkTileCollision(horizontal) {
        const p = this.player;
        const left = Math.floor(p.x / TILE_SIZE);
        const right = Math.floor((p.x + p.width - 1) / TILE_SIZE);
        const top = Math.floor(p.y / TILE_SIZE);
        const bottom = Math.floor((p.y + p.height) / TILE_SIZE);

        for (let ty = top; ty <= bottom; ty++) {
            for (let tx = left; tx <= right; tx++) {
                const tile = this.getTile(tx, ty);
                if (tile === TILE_EMPTY) continue;

                // رسیدن به پرچم پایان
                if (tile === TILE_FLAG_POLE || tile === TILE_FLAG_TOP) {
                    this.state = 'CLEARED';
                    this.sound.playPowerup();
                    return;
                }

                const tileRect = {
                    x: tx * TILE_SIZE,
                    y: ty * TILE_SIZE,
                    width: TILE_SIZE,
                    height: TILE_SIZE
                };

                // بررسی اشتراک سطوح
                if (p.x < tileRect.x + tileRect.width &&
                    p.x + p.width > tileRect.x &&
                    p.y < tileRect.y + tileRect.height &&
                    p.y + p.height > tileRect.y) {

                    if (horizontal) {
                        if (p.vx > 0) {
                            p.x = tileRect.x - p.width;
                            p.vx = 0;
                        } else if (p.vx < 0) {
                            p.x = tileRect.x + tileRect.width;
                            p.vx = 0;
                        }
                    } else {
                        if (p.vy > 0) { // سقوط به سمت زمین
                            p.y = tileRect.y - p.height;
                            p.vy = 0;
                            p.isGrounded = true;
                            p.isJumping = false;
                        } else if (p.vy < 0) { // اصابت سر به بلاک از زیر
                            p.y = tileRect.y + tileRect.height;
                            p.vy = 0;
                            this.hitBlock(tx, ty, tile);
                        }
                    }
                }
            }
        }
    }

    hitBlock(tx, ty, tile) {
        if (tile === TILE_QUESTION_COIN) {
            this.setTile(tx, ty, TILE_EMPTY_BLOCK);
            this.coins++;
            this.score += 200;
            this.sound.playCoin();
            this.spawnCoinParticle(tx * TILE_SIZE + 8, (ty - 1) * TILE_SIZE);
        } else if (tile === TILE_QUESTION_MUSHROOM) {
            this.setTile(tx, ty, TILE_EMPTY_BLOCK);
            this.mushrooms.push({
                x: tx * TILE_SIZE,
                y: (ty - 1) * TILE_SIZE,
                vx: 60,
                vy: 0,
                active: true
            });
            this.sound.playPowerup();
        } else if (tile === TILE_BRICK) {
            if (this.player.power > 0) {
                this.setTile(tx, ty, TILE_EMPTY);
                this.sound.playStomp();
                this.score += 50;
            } else {
                this.sound.playStomp();
            }
        }
    }

    updateEnemies(dt) {
        for (const g of this.goombas) {
            if (!g.alive) {
                g.squishTimer -= dt;
                continue;
            }

            g.x += g.vx * dt;

            // برخورد با موانع روبرو
            const tx = Math.floor((g.vx > 0 ? g.x + 24 : g.x) / TILE_SIZE);
            const ty = Math.floor((g.y + 12) / TILE_SIZE);
            const t = this.getTile(tx, ty);
            if (t !== TILE_EMPTY && t !== TILE_FLAG_POLE) {
                g.vx *= -1; // تغییر مسیر
            }

            // تصادم با بازیکن
            const p = this.player;
            if (p.x < g.x + 24 && p.x + p.width > g.x &&
                p.y < g.y + 24 && p.y + p.height > g.y) {

                if (p.vy > 0 && p.y + p.height - p.vy * dt <= g.y + 12) {
                    // له کردن گومبا با پریدن روی آن
                    g.alive = false;
                    g.squishTimer = 0.5;
                    p.vy = -260; // جهش مجدد ماریو
                    this.score += 100;
                    this.sound.playStomp();
                } else if (p.invulnerableTime <= 0) {
                    if (p.power > 0) {
                        p.power = 0;
                        p.height = 28;
                        p.invulnerableTime = 2.0;
                        this.sound.playStomp();
                    } else {
                        this.killPlayer();
                    }
                }
            }
        }
    }

    updateMushrooms(dt) {
        for (const m of this.mushrooms) {
            if (!m.active) continue;
            m.vy += 800 * dt;
            m.x += m.vx * dt;
            m.y += m.vy * dt;

            // کف زمین برای قارچ
            const groundY = 11 * TILE_SIZE - 24;
            if (m.y >= groundY) {
                m.y = groundY;
                m.vy = 0;
            }

            // تصادم با ماریو
            const p = this.player;
            if (p.x < m.x + 24 && p.x + p.width > m.x &&
                p.y < m.y + 24 && p.y + p.height > m.y) {
                m.active = false;
                p.power = 1;
                p.height = 38;
                p.y -= 10;
                this.score += 1000;
                this.sound.playPowerup();
            }
        }
    }

    spawnCoinParticle(x, y) {
        this.particles.push({
            x, y, vy: -200, life: 0.35
        });
    }

    updateParticles(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const pt = this.particles[i];
            pt.y += pt.vy * dt;
            pt.life -= dt;
            if (pt.life <= 0) {
                this.particles.splice(i, 1);
            }
        }
    }

    checkLevelBounds() {
        if (this.player.y > 420) {
            this.killPlayer();
        }
        if (this.player.x < this.cameraX) {
            this.player.x = this.cameraX;
            this.player.vx = 0;
        }
    }

    killPlayer() {
        if (this.state === 'DEAD') return;
        this.state = 'DEAD';
        this.player.vy = -380;
        this.sound.playDie();
    }

    resetToCheckpoint() {
        this.initPlayer();
        this.cameraX = 0;
        this.timeLeft = 400;
        this.state = 'PLAYING';
    }

    // -------------------------------------------------------------
    // رندر گرافیک پیکسلی و HUD (بدون وابستگی تصویری)
    // -------------------------------------------------------------
    render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.fillStyle = '#5c94fc'; // رنگ آسمان رترو
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // ترجمه مختصات دوربین
        ctx.translate(-Math.floor(this.cameraX), 0);

        this.renderBackgroundCloudsAndHills();
        this.renderTilemap();
        this.renderMushrooms();
        this.renderEnemies();
        this.renderPlayer();
        this.renderParticles();

        ctx.restore();

        // رندر ثابت HUD بدون متأثر شدن از دوربین
        this.renderHUD();
    }

    renderBackgroundCloudsAndHills() {
        const ctx = this.ctx;
        // رسم ابرها به شیوه پیکسلی
        ctx.fillStyle = '#fefefe';
        for (let i = 0; i < 15; i++) {
            const cx = i * 340 + 60;
            ctx.beginPath();
            ctx.arc(cx, 80, 24, 0, Math.PI * 2);
            ctx.arc(cx + 20, 70, 28, 0, Math.PI * 2);
            ctx.arc(cx + 40, 80, 24, 0, Math.PI * 2);
            ctx.fill();
        }

        // تپه‌های سبز
        ctx.fillStyle = '#00a800';
        for (let i = 0; i < 12; i++) {
            const hx = i * 420;
            ctx.beginPath();
            ctx.moveTo(hx, 352);
            ctx.quadraticCurveTo(hx + 80, 240, hx + 160, 352);
            ctx.fill();
        }
    }

    renderTilemap() {
        const ctx = this.ctx;
        const startCol = Math.floor(this.cameraX / TILE_SIZE);
        const endCol = startCol + Math.ceil(this.canvas.width / TILE_SIZE) + 1;

        for (let ty = 0; ty < this.mapHeight; ty++) {
            for (let tx = startCol; tx <= endCol; tx++) {
                const tile = this.getTile(tx, ty);
                if (tile === TILE_EMPTY) continue;

                const rx = tx * TILE_SIZE;
                const ry = ty * TILE_SIZE;

                switch (tile) {
                    case TILE_GROUND:
                        ctx.fillStyle = '#d86800';
                        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#00a800';
                        ctx.fillRect(rx, ry, TILE_SIZE, 6);
                        break;
                    case TILE_BRICK:
                        ctx.fillStyle = '#b84418';
                        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.strokeRect(rx, ry + 16, TILE_SIZE, 1);
                        ctx.strokeRect(rx + 16, ry, 1, 16);
                        break;
                    case TILE_QUESTION_COIN:
                    case TILE_QUESTION_MUSHROOM:
                        ctx.fillStyle = '#fc9838';
                        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#000';
                        ctx.strokeRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 20px monospace';
                        ctx.fillText('?', rx + 10, ry + 24);
                        break;
                    case TILE_EMPTY_BLOCK:
                        ctx.fillStyle = '#8b5a2b';
                        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#000';
                        ctx.strokeRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        break;
                    case TILE_PIPE_TOP_LEFT:
                    case TILE_PIPE_TOP_RIGHT:
                    case TILE_PIPE_BODY_LEFT:
                    case TILE_PIPE_BODY_RIGHT:
                        ctx.fillStyle = '#00a800';
                        ctx.fillRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#005000';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(rx, ry, TILE_SIZE, TILE_SIZE);
                        break;
                    case TILE_FLAG_POLE:
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(rx + 14, ry, 4, TILE_SIZE);
                        break;
                    case TILE_FLAG_TOP:
                        ctx.fillStyle = '#00a800';
                        ctx.beginPath();
                        ctx.arc(rx + 16, ry + 16, 8, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                }
            }
        }
    }

    renderPlayer() {
        const p = this.player;
        const ctx = this.ctx;

        if (p.invulnerableTime > 0 && Math.floor(performance.now() / 60) % 2 === 0) {
            return; // فلاش زدن هنگام آسیب‌ناپذیری
        }

        ctx.save();
        ctx.translate(Math.floor(p.x), Math.floor(p.y));
        if (!p.facingRight) {
            ctx.scale(-1, 1);
            ctx.translate(-p.width, 0);
        }

        // پالت رنگ ماریو
        const hatColor = '#d82800';
        const overallColor = '#0058f8';
        const skinColor = '#fc9838';

        // سر و کلاه
        ctx.fillStyle = hatColor;
        ctx.fillRect(4, 0, 16, 6);
        ctx.fillRect(2, 4, 20, 4);

        // صورت
        ctx.fillStyle = skinColor;
        ctx.fillRect(6, 8, 14, 8);
        ctx.fillStyle = '#000';
        ctx.fillRect(16, 9, 3, 4); // چشم

        // تنه و لباس
        if (p.power > 0) {
            // لباس سوپر ماریو بلندتر است
            ctx.fillStyle = overallColor;
            ctx.fillRect(2, 16, 18, 14);
            ctx.fillStyle = hatColor;
            ctx.fillRect(4, 18, 14, 8);
            // پاها
            ctx.fillStyle = '#6b3c00';
            ctx.fillRect(3, 30, 7, 8);
            ctx.fillRect(12, 30, 7, 8);
        } else {
            ctx.fillStyle = overallColor;
            ctx.fillRect(3, 14, 16, 10);
            ctx.fillStyle = hatColor;
            ctx.fillRect(5, 15, 12, 5);
            // پاها
            ctx.fillStyle = '#6b3c00';
            ctx.fillRect(2, 22, 8, 6);
            ctx.fillRect(12, 22, 8, 6);
        }

        ctx.restore();
    }

    renderEnemies() {
        const ctx = this.ctx;
        for (const g of this.goombas) {
            if (!g.alive && g.squishTimer <= 0) continue;

            ctx.save();
            ctx.translate(Math.floor(g.x), Math.floor(g.y));

            if (!g.alive) {
                // حالت له شده
                ctx.fillStyle = '#a84400';
                ctx.fillRect(0, 16, 26, 8);
                ctx.fillStyle = '#000';
                ctx.fillRect(4, 18, 4, 2);
                ctx.fillRect(18, 18, 4, 2);
            } else {
                // بدن گومبا
                ctx.fillStyle = '#a84400';
                ctx.fillRect(2, 0, 22, 16);
                ctx.fillRect(0, 4, 26, 12);

                // چشم‌ها
                ctx.fillStyle = '#fff';
                ctx.fillRect(5, 6, 4, 6);
                ctx.fillRect(17, 6, 4, 6);
                ctx.fillStyle = '#000';
                ctx.fillRect(7, 8, 2, 4);
                ctx.fillRect(17, 8, 2, 4);

                // پاها
                ctx.fillStyle = '#000';
                ctx.fillRect(1, 18, 8, 6);
                ctx.fillRect(17, 18, 8, 6);
            }
            ctx.restore();
        }
    }

    renderMushrooms() {
        const ctx = this.ctx;
        for (const m of this.mushrooms) {
            if (!m.active) continue;
            ctx.save();
            ctx.translate(Math.floor(m.x), Math.floor(m.y));

            // کلاه قارچ قرمز
            ctx.fillStyle = '#d82800';
            ctx.beginPath();
            ctx.arc(12, 10, 12, Math.PI, 0);
            ctx.fill();

            // خال‌های سفید
            ctx.fillStyle = '#fff';
            ctx.fillRect(9, 3, 6, 6);
            ctx.fillRect(2, 8, 4, 4);
            ctx.fillRect(18, 8, 4, 4);

            // ساقه
            ctx.fillStyle = '#fce4a0';
            ctx.fillRect(6, 10, 12, 10);
            ctx.restore();
        }
    }

    renderParticles() {
        const ctx = this.ctx;
        ctx.fillStyle = '#ffd700';
        for (const pt of this.particles) {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    renderHUD() {
        const ctx = this.ctx;
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;

        // MARIO - SCORE
        ctx.fillText('MARIO', 40, 28);
        ctx.fillText(String(this.score).padStart(6, '0'), 40, 48);

        // COINS
        ctx.fillText(`🪙x${String(this.coins).padStart(2, '0')}`, 200, 48);

        // WORLD
        ctx.fillText('WORLD', 360, 28);
        ctx.fillText(this.world, 375, 48);

        // TIME
        ctx.fillText('TIME', 520, 28);
        ctx.fillText(String(this.timeLeft).padStart(3, '0'), 530, 48);

        ctx.shadowBlur = 0;

        // پیام‌های وضعیت
        if (this.state === 'GAMEOVER') {
            this.renderOverlayMessage('GAME OVER', 'برای شروع مجدد، صفحه را رفرش کنید.');
        } else if (this.state === 'CLEARED') {
            this.renderOverlayMessage('STAGE CLEAR!', `امتیاز نهایی: ${this.score}`);
        }
    }

    renderOverlayMessage(heading, subtitle) {
        const ctx = this.ctx;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        ctx.fillStyle = '#fc9838';
        ctx.font = 'bold 36px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(heading, this.canvas.width / 2, 180);

        ctx.fillStyle = '#ffffff';
        ctx.font = '16px "Courier New", monospace';
        ctx.fillText(subtitle, this.canvas.width / 2, 220);
        ctx.textAlign = 'start';
    }
}

// راه‌اندازی پس از بارگذاری DOM
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('marioCanvas');
    const game = new SuperMarioEngine(canvas);
    window.MarioGameInstance = game;
    game.boot();
});
</script>
