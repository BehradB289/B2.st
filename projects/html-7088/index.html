<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- سخت‌گیری امنیتی با Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>بازی سوپر ماریو | استودیو B2.st</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            margin-bottom: 12px;
            text-align: center;
        }
        h1 {
            font-size: 1.3rem;
            color: #ff3e3e;
            letter-spacing: 1px;
        }
        .canvas-wrapper {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 4px solid #333333;
            border-radius: 6px;
            background: #000;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        footer {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #777777;
        }
    </style>
</head>
<body>
    <header>
        <h1>B2.st Mario Security Engine</h1>
    </header>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
    </div>

    <footer>
        توسعه داده شده بر پایه استاندارد ایمن ES6 Modules توسط واحد امنیت B2.st
    </footer>

    <!-- راه‌اندازی ماژولار موتور بازی -->
    <script type="module">
        import { GameEngine } from "./src/engine/GameEngine.js";

        window.addEventListener("DOMContentLoaded", () => {
            try {
                const engine = new GameEngine("gameCanvas");
                engine.start();
            } catch (err) {
                console.error("[B2.st Engine Boot Failed]:", err);
            }
        });
    </script>
</body>
</html>
