<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- B2.st Layer 10 Security: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Super Mario - B2.st Secure Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d1117;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: #58a6ff;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 10px rgba(88, 166, 255, 0.2);
            border: 3px solid #30363d;
            border-radius: 8px;
            background: #5c94fc;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #5c94fc;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        <div id="ui-overlay">
            <div>MARIO <br><span id="score">000000</span></div>
            <div>COINS <br><span id="coins">x00</span></div>
            <div>WORLD <br><span>1-1</span></div>
            <div>TIME  <br><span id="time">400</span></div>
        </div>
    </div>

    <!-- ES Module Entrypoint with Strict Import Isolation -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
