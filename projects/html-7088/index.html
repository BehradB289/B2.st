<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2.st Super Mario - Memory Optimized Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #11141a;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 3px solid #2c3e50;
            border-radius: 8px;
            background: #5c94fc;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            direction: ltr;
        }
        #telemetry-bar {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            font-family: monospace;
            background: #1a222d;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #34495e;
            font-size: 13px;
        }
        .stat-val { color: #2ecc71; font-weight: bold; }
        .stat-alert { color: #e74c3c; font-weight: bold; }
        .controls {
            margin-top: 8px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="marioCanvas" width="640" height="360"></canvas>
        <div id="hud">
            <div>MARIO: <span id="score-disp">000000</span></div>
            <div>COINS: <span id="coins-disp">x00</span></div>
            <div>WORLD: 1-1</div>
            <div>STATUS: <span id="state-disp" style="color:#2ecc71;">ONLINE</span></div>
        </div>
    </div>

    <div id="telemetry-bar">
        <div>Active Timers: <span id="timers-cnt" class="stat-val">0</span></div>
        <div>Listeners: <span id="listeners-cnt" class="stat-val">0</span></div>
        <div>Active Entities: <span id="entities-cnt" class="stat-val">0</span></div>
        <div>Pool Recycles: <span id="recycles-cnt" class="stat-val">0</span></div>
    </div>

    <div class="controls">
        کلیدها: پیکان‌های چپ/راست یا A/D (حرکت) | Space یا W (پرش) | R (ریست تمیز محیط)
    </div>

    <script type="module">
        import { MemoryGuard } from './src/core/memory_guard.js';

        // مقداردهی اولیه سیستم محافظ حافظه با سقف ۲۵۰ مگابایت
        const guard = new MemoryGuard({ maxMemoryMB: 250 });
        const canvas = document.getElementById('marioCanvas');
        const ctx = canvas.getContext('2d');

        // رجیستر کردن Object Pool برای ذرات (Particles) و دشمن‌ها جهت جلوگیری از Allocations مکرر
        guard.registerPool('particles', 
            () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, active: false }),
            (p) => { p.x = 0; p.y = 0; p.vx = 0; p.vy = 0; p.life = 0; p.active = false; },
            64
        );

        guard.registerPool('enemies',
            () => ({ x: 0, y: 0, vx: -1.2, width: 24, height: 24, isDead: false, type: 'goomba' }),
            (e) => { e.x = 0; e.y = 0; e.vx = -1.2; e.isDead = false; },
            16
        );

        // وضعیت پایدار بازی
        const gameState = {
            mario: {
                x: 60,
                y: 280,
                vx: 0,
                vy: 0,
                width: 24,
                height: 32,
                grounded: true,
                score: 0,
                coins: 0
            },
            keys: { left: false, right: false, jump: false },
            gravity: 0.55,
            floorY: 304,
            entities: [],
            particles: [],
            rafId: null
        };

        // لایه ورودی: اتصال امن و بدون نشت رویدادهای کیبورد
        guard.bindEvent(window, 'keydown', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') gameState.keys.right = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') gameState.keys.left = true;
            if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && gameState.mario.grounded) {
                gameState.mario.vy = -11.5;
                gameState.mario.grounded = false;
                spawnJumpSpark(gameState.mario.x + 12, gameState.mario.y + 32);
            }
            if (e.code === 'KeyR') resetLevel();
        }, {}, 'input');

        guard.bindEvent(window, 'keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') gameState.keys.right = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') gameState.keys.left = false;
        }, {}, 'input');

        function spawnJumpSpark(x, y) {
            for (let i = 0; i < 4; i++) {
                const p = guard.acquire('particles');
                p.x = x;
                p.y = y;
                p.vx = (Math.random() - 0.5) * 4;
                p.vy = -Math.random() * 2 - 1;
                p.life = 15;
                p.active = true;
                gameState.particles.push(p);
            }
        }

        // اسپاون پریودیک دشمنان از طریق استخر بدون نشت تایمر
        function startEnemySpawner() {
            guard.safeSetInterval(() => {
                if (gameState.entities.length < 8) {
                    const enemy = guard.acquire('enemies');
                    enemy.x = canvas.width + 20;
                    enemy.y = gameState.floorY - 24;
                    enemy.vx = -(Math.random() * 0.8 + 1.0);
                    gameState.entities.push(enemy);
                }
            }, 3000, 'spawner');
        }

        function resetLevel() {
            // پاک‌سازی تمام پروسه‌های موقت بدون اختلال در ورودی‌های پایه
            guard.clearGroup('spawner');
            
            // بازگرداندن اشیاء به استخرها
            for (let i = 0; i < gameState.entities.length; i++) {
                guard.release('enemies', gameState.entities[i]);
            }
            gameState.entities.length = 0;

            for (let i = 0; i < gameState.particles.length; i++) {
                guard.release('particles', gameState.particles[i]);
            }
            gameState.particles.length = 0;

            gameState.mario.x = 60;
            gameState.mario.y = gameState.floorY - gameState.mario.height;
            gameState.mario.vx = 0;
            gameState.mario.vy = 0;
            gameState.mario.grounded = true;

            startEnemySpawner();
        }

        // حلقه پردازش با صفر تخصیص حافظه حین اجرا (Zero Runtime Allocations)
        function update() {
            const m = gameState.mario;

            // فیزیک ماریو
            if (gameState.keys.right) m.vx = 3.2;
            else if (gameState.keys.left) m.vx = -3.2;
            else m.vx *= 0.8;

            m.x += m.vx;
            m.y += m.vy;

            if (m.y + m.height < gameState.floorY) {
                m.vy += gameState.gravity;
                m.grounded = false;
            } else {
                m.y = gameState.floorY - m.height;
                m.vy = 0;
                m.grounded = true;
            }

            if (m.x < 0) m.x = 0;
            if (m.x > canvas.width - m.width) m.x = canvas.width - m.width;

            // بروزرسانی و هرس فوق‌سریع ذرات با O(1) FastCull
            for (let i = 0; i < gameState.particles.length; i++) {
                const p = gameState.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) p.active = false;
            }

            guard.fastCull(gameState.particles, (p) => {
                if (!p.active) {
                    guard.release('particles', p);
                    return false;
                }
                return true;
            });

            // بروزرسانی و برخورد با دشمنان
            for (let i = 0; i < gameState.entities.length; i++) {
                const en = gameState.entities[i];
                en.x += en.vx;

                // تست برخورد AABB
                if (m.x < en.x + en.width &&
                    m.x + m.width > en.x &&
                    m.y < en.y + en.height &&
                    m.y + m.height > en.y) {
                    
                    // برخورد از بالا (کشتن دشمن)
                    if (m.vy > 0 && m.y + m.height - m.vy <= en.y + 12) {
                        en.isDead = true;
                        m.vy = -7.0;
                        m.score += 100;
                        spawnJumpSpark(en.x + 12, en.y + 12);
                    } else {
                        // ریست در صورت آسیب
                        resetLevel();
                        return;
                    }
                }

                if (en.x < -40) en.isDead = true;
            }

            // هرس دشمنان مرده و بازگشت به استخر
            guard.fastCull(gameState.entities, (en) => {
                if (en.isDead) {
                    guard.release('enemies', en);
                    return false;
                }
                return true;
            });

            // Telemetry UI Sync
            const stats = guard.getStats();
            document.getElementById('timers-cnt').textContent = stats.activeIntervals + stats.activeTimeouts;
            document.getElementById('listeners-cnt').textContent = stats.trackedListeners;
            document.getElementById('entities-cnt').textContent = gameState.entities.length + gameState.particles.length;
            document.getElementById('recycles-cnt').textContent = stats.metrics.reclaimedObjects;
            document.getElementById('score-disp').textContent = String(m.score).padStart(6, '0');
        }

        // رندرینگ بهینه با کشیدن مستقیم پریمیتیوها
        function draw() {
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // زمین
            ctx.fillStyle = '#9b4802';
            ctx.fillRect(0, gameState.floorY, canvas.width, canvas.height - gameState.floorY);
            ctx.fillStyle = '#22b14c';
            ctx.fillRect(0, gameState.floorY, canvas.width, 6);

            // ماریو (رندر سبک بدون Allocations)
            ctx.fillStyle = '#d63031';
            ctx.fillRect(gameState.mario.x, gameState.mario.y, gameState.mario.width, gameState.mario.height);
            ctx.fillStyle = '#0984e3';
            ctx.fillRect(gameState.mario.x + 4, gameState.mario.y + 14, gameState.mario.width - 8, 12);

            // دشمنان
            ctx.fillStyle = '#795548';
            for (let i = 0; i < gameState.entities.length; i++) {
                const en = gameState.entities[i];
                ctx.fillRect(en.x, en.y, en.width, en.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(en.x + 3, en.y + 4, 4, 4);
                ctx.fillRect(en.x + 11, en.y + 4, 4, 4);
                ctx.fillStyle = '#795548';
            }

            // ذرات
            ctx.fillStyle = '#ffeaa7';
            for (let i = 0; i < gameState.particles.length; i++) {
                const p = gameState.particles[i];
                ctx.fillRect(p.x, p.y, 3, 3);
            }
        }

        // حلقه اصلی تحت نظارت MemoryGuard
        function loop() {
            update();
            draw();
            gameState.rafId = guard.safeRAF(loop, 'main_loop');
        }

        // شروع امن
        startEnemySpawner();
        loop();
    </script>
</body>
</html>
