<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Super Mario - B2.st Secure Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 4px solid #334155;
            border-radius: 8px;
            background-color: #5c94fc;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        .ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 2px 2px #000000;
            pointer-events: none;
            direction: ltr;
        }
        .controls-hint {
            margin-top: 14px;
            color: #94a3b8;
            font-size: 13px;
            direction: rtl;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="640" height="400"></canvas>
        <div class="ui-panel">
            <div id="mario-score">MARIO: 000000</div>
            <div id="mario-coins">COINS: 00</div>
            <div id="mario-world">WORLD: 1-1</div>
            <div id="mario-lives">LIVES: 3</div>
        </div>
    </div>

    <div class="controls-hint">
        کنترل‌ها: جهت‌های چپ / راست یا A / D برای حرکت | Space / W یا جهت بالا برای پرش
    </div>

    <script type="module" src="./src/index.js"></script>
</body>
</html>
