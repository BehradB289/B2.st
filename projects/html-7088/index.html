<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario - B2.st Hardened Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --arcade-rim: #1e293b;
            --accent: #ef4444;
            --screen-glow: rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .arcade-cabinet {
            position: relative;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 4px solid #334155;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cabinet-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .security-badge {
            color: #10b981;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .security-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }

        .canvas-wrapper {
            position: relative;
            background-color: #5c94fc;
            border: 3px solid #000;
            border-radius: 4px;
            box-shadow: 0 0 20px var(--screen-glow);
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .cabinet-footer {
            margin-top: 12px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #64748b;
        }

        .controls-hint {
            display: flex;
            gap: 12px;
        }

        .controls-hint span {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #334155;
            color: #cbd5e1;
        }

        .backup-toast {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .backup-toast.active {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="arcade-cabinet">
    <div class="cabinet-header">
        <span>B2.st HARDENED ENGINE // ZERO-TAMPER</span>
        <div class="security-badge" id="secBadge">AUDIT LEVEL-10 ACTIVE</div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="640" height="400"></canvas>
        <div class="backup-toast" id="backupToast">💾 اسنپ‌شات خودکار ذخیره شد</div>
    </div>

    <div class="cabinet-footer">
        <div class="controls-hint">
            <span>◄ ► / A D حرکت</span>
            <span>Space / W پرش</span>
            <span>Shift دویدن سریع</span>
            <span>R بازیابی بکاپ</span>
        </div>
        <div id="fpsCounter">FPS: 60</div>
    </div>
</div>

<!-- بارگذاری ماژول بکاپ امنیتی -->
<script src="src/utils/backup.js"></script>

<script>
/**
 * ============================================================================
 * Super Mario Canvas Engine - Fully Hardened & Synthesized
 * Certified by Studio B2.st Cybersecurity Division
 * ============================================================================
 */
(() => {
    'use strict';

    // ----------------------------------------------------
    // ۱. سیستم تولید صدای سنتز شده 8-Bit (بدون نیاز به فایل خارجی)
    // ----------------------------------------------------
    class ChiptuneAudio {
        constructor() {
            this.ctx = null;
        }

        _init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        playJump() {
            this._init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            const now = this.ctx.currentTime;
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        playCoin() {
            this._init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            const now = this.ctx.currentTime;
            osc.frequency.setValueAtTime(987.77, now); // B5
            osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        playStomp() {
            this._init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            const now = this.ctx.currentTime;
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(30, now + 0.12);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
        }

        playDie() {
            this._init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            const now = this.ctx.currentTime;
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.5);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    const sound = new ChiptuneAudio();

    // ----------------------------------------------------
    // ۲. سیستم فیزیک، وضعیت و رندرینگ موتور بازی
    // ----------------------------------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const toast = document.getElementById('backupToast');
    const fpsLabel = document.getElementById('fpsCounter');

    const GRAVITY = 0.58;
    const FRICTION = 0.85;

    // متغیرهای چرخه بازی و دیباگ
    let lastTime = performance.now();
    let frameCount = 0;
    let fpsTimer = 0;

    // وضعیت داخلی حفاظت‌شده (Tamper-Resistant Encapsulation)
    const GameState = {
        score: 0,
        coins: 0,
        lives: 3,
        world: '1-1',
        timeRemaining: 400,
        powerState: 'small',
        cameraX: 0,
        isGameOver: false,
        isLevelWon: false,
        checkpoint: { x: 50, y: 300 }
    };

    // نقشه مرحله (World Map - Matrix Tiles)
    // 0: هوا, 1: زمین چمنی, 2: آجر خاکی, 3: بلوک علامت سوال, 4: لوله سبز
    const TILE_SIZE = 32;
    const LEVEL_COLS = 120;
    const LEVEL_ROWS = 13;
    const tileMap = new Uint8Array(LEVEL_COLS * LEVEL_ROWS);

    function setTile(c, r, val) {
        if (c >= 0 && c < LEVEL_COLS && r >= 0 && r < LEVEL_ROWS) {
            tileMap[r * LEVEL_COLS + c] = val;
        }
    }

    function getTile(c, r) {
        if (c < 0 || c >= LEVEL_COLS || r < 0 || r >= LEVEL_ROWS) return 0;
        return tileMap[r * LEVEL_COLS + c];
    }

    // تولید زمین و موانع استاندارد مرحله 1-1
    for (let c = 0; c < LEVEL_COLS; c++) {
        // ایجاد دره‌ها (Pits)
        if ((c > 25 && c < 28) || (c > 70 && c < 73)) continue;
        setTile(c, 11, 1);
        setTile(c, 12, 1);
    }

    // قرار دادن آجرها و جعبه‌های شانس
    setTile(12, 8, 3);
    setTile(14, 8, 2);
    setTile(15, 8, 3);
    setTile(16, 8, 2);
    setTile(17, 8, 3);
    setTile(15, 4, 3);

    // لوله‌ها (Pipes)
    function buildPipe(col, height) {
        for (let h = 0; h < height; h++) {
            setTile(col, 10 - h, 4);
            setTile(col + 1, 10 - h, 4);
        }
    }
    buildPipe(20, 2);
    buildPipe(38, 3);
    buildPipe(55, 4);

    // میله پرچم پایان مرحله (Flagpole)
    for (let r = 2; r <= 10; r++) {
        setTile(110, r, 5); // 5: میله پرچم
    }

    // ----------------------------------------------------
    // ۳. کلاس موجودیت ماریو (Player Controller)
    // ----------------------------------------------------
    class Mario {
        constructor() {
            this.width = 24;
            this.height = 30;
            this.resetPosition();
            this.vx = 0;
            this.vy = 0;
            this.grounded = false;
            this.facingRight = true;
            this.invulnerableTimer = 0;
        }

        resetPosition() {
            this.x = GameState.checkpoint.x;
            this.y = GameState.checkpoint.y;
            this.vx = 0;
            this.vy = 0;
        }

        update(keys) {
            const moveSpeed = keys['ShiftLeft'] || keys['ShiftRight'] ? 3.6 : 2.5;

            if (keys['ArrowRight'] || keys['KeyD']) {
                if (this.vx < moveSpeed) this.vx += 0.45;
                this.facingRight = true;
            } else if (keys['ArrowLeft'] || keys['KeyA']) {
                if (this.vx > -moveSpeed) this.vx -= 0.45;
                this.facingRight = false;
            } else {
                this.vx *= FRICTION;
                if (Math.abs(this.vx) < 0.05) this.vx = 0;
            }

            // پرش مطمئن با تست لایه‌ای
            if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && this.grounded) {
                this.vy = -12.2;
                this.grounded = false;
                sound.playJump();
            }

            // گرانش
            this.vy += GRAVITY;
            if (this.vy > 12) this.vy = 12; // جلوگیری از Clipping و سقوط با سرعت نامحدود

            // برخورد افقی و عمودی (Horizontal & Vertical Separation)
            this.x += this.vx;
            this.checkCollisions(true);

            this.y += this.vy;
            this.grounded = false;
            this.checkCollisions(false);

            // سقوط در چاه
            if (this.y > canvas.height + 50) {
                this.die();
            }

            if (this.invulnerableTimer > 0) {
                this.invulnerableTimer--;
            }
        }

        checkCollisions(horizontal) {
            const left = Math.floor(this.x / TILE_SIZE);
            const right = Math.floor((this.x + this.width) / TILE_SIZE);
            const top = Math.floor(this.y / TILE_SIZE);
            const bottom = Math.floor((this.y + this.height) / TILE_SIZE);

            for (let r = top; r <= bottom; r++) {
                for (let c = left; c <= right; c++) {
                    const tile = getTile(c, r);
                    if (tile > 0) {
                        const tileX = c * TILE_SIZE;
                        const tileY = r * TILE_SIZE;

                        // بررسی تعامل با پرچم پایان
                        if (tile === 5) {
                            GameState.isLevelWon = true;
                            sound.playCoin();
                            return;
                        }

                        // محاسبه همپوشانی AABB
                        if (
                            this.x < tileX + TILE_SIZE &&
                            this.x + this.width > tileX &&
                            this.y < tileY + TILE_SIZE &&
                            this.y + this.height > tileY
                        ) {
                            if (horizontal) {
                                if (this.vx > 0) {
                                    this.x = tileX - this.width;
                                    this.vx = 0;
                                } else if (this.vx < 0) {
                                    this.x = tileX + TILE_SIZE;
                                    this.vx = 0;
                                }
                            } else {
                                if (this.vy > 0) {
                                    this.y = tileY - this.height;
                                    this.vy = 0;
                                    this.grounded = true;
                                } else if (this.vy < 0) {
                                    this.y = tileY + TILE_SIZE;
                                    this.vy = 0;
                                    // ضربه زدن به جعبه شانس
                                    if (tile === 3) {
                                        setTile(c, r, 2); // تبدیل به آجر عادی
                                        GameState.coins++;
                                        GameState.score += 200;
                                        sound.playCoin();
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        die() {
            sound.playDie();
            GameState.lives--;
            if (GameState.lives <= 0) {
                GameState.isGameOver = true;
            } else {
                this.resetPosition();
                this.invulnerableTimer = 60;
            }
        }

        render(c) {
            if (this.invulnerableTimer % 6 >= 3) return; // حالت چشمک‌زن پس از ضربه
            c.save();
            c.translate(this.x, this.y);

            // ترسیم پیکسلی ماریو (Procedural Pixel Red/Blue Outfit)
            // کلاه و پیراهن قرمز
            c.fillStyle = '#dc2626';
            c.fillRect(4, 0, 16, 8); // سر و کلاه
            c.fillRect(2, 8, 20, 12); // بدنه

            // صورت
            c.fillStyle = '#fbcfe8';
            c.fillRect(this.facingRight ? 12 : 4, 3, 8, 6);

            // لباس کار آبی
            c.fillStyle = '#2563eb';
            c.fillRect(6, 14, 12, 10);

            // کفش‌ها
            c.fillStyle = '#78350f';
            c.fillRect(2, 24, 8, 6);
            c.fillRect(14, 24, 8, 6);

            c.restore();
        }
    }

    // ----------------------------------------------------
    // ۴. کلاس دشمنان (Goomba Entity)
    // ----------------------------------------------------
    class Goomba {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = 24;
            this.height = 24;
            this.vx = -1;
            this.dead = false;
            this.remove = false;
        }

        update() {
            if (this.dead) return;
            this.x += this.vx;

            // بازگشت در برخورد با لبه یا موانع
            const nextCol = Math.floor((this.x + (this.vx > 0 ? this.width : 0)) / TILE_SIZE);
            const row = Math.floor((this.y + 12) / TILE_SIZE);
            if (getTile(nextCol, row) > 0) {
                this.vx *= -1;
            }
        }

        render(c) {
            if (this.remove) return;
            c.save();
            c.translate(this.x, this.y);
            if (this.dead) {
                // له شده
                c.fillStyle = '#92400e';
                c.fillRect(0, 16, 24, 8);
            } else {
                // کلاه قارچ قهوه‌ای
                c.fillStyle = '#b45309';
                c.beginPath();
                c.arc(12, 10, 12, Math.PI, 0, false);
                c.fill();
                c.fillRect(2, 10, 20, 8);
                // چشم‌ها
                c.fillStyle = '#000';
                c.fillRect(6, 8, 3, 5);
                c.fillRect(15, 8, 3, 5);
                // پاها
                c.fillStyle = '#000';
                c.fillRect(1, 18, 7, 6);
                c.fillRect(16, 18, 7, 6);
            }
            c.restore();
        }
    }

    // نمونه‌سازی
    const mario = new Mario();
    const enemies = [
        new Goomba(400, 320),
        new Goomba(650, 320),
        new Goomba(900, 320),
        new Goomba(1300, 320),
        new Goomba(1600, 320)
    ];

    // سیستم کلیدها
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        // فعال‌سازی ریکاوری فوری بکاپ با کلید R
        if (e.code === 'KeyR' && window.B2BackupEngine) {
            const restored = window.B2BackupEngine.restoreLatest();
            if (restored) {
                GameState.score = restored.score;
                GameState.coins = restored.coins;
                GameState.lives = restored.lives;
                mario.x = restored.checkpoint.x;
                mario.y = restored.checkpoint.y;
                showToast('بازیابی موفق از آخرین نقطه امن!');
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });

    // راه‌اندازی ماژول بکاپ خودکار B2.st
    if (window.B2BackupEngine) {
        window.B2BackupEngine.startAutoBackup(() => {
            return {
                score: GameState.score,
                coins: GameState.coins,
                lives: GameState.lives,
                world: GameState.world,
                checkpoint: { x: mario.x, y: mario.y },
                powerState: GameState.powerState,
                timeRemaining: Math.floor(GameState.timeRemaining)
            };
        }, 20000); // هر ۲۰ ثانیه

        window.B2BackupEngine.subscribe((event) => {
            if (event === 'created') {
                showToast('اسنپ‌شات خودکار ذخیره شد 💾');
            }
        });
    }

    function showToast(text) {
        toast.textContent = text;
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 2500);
    }

    // ----------------------------------------------------
    // ۵. حلقه پردازش و رندرینگ اصلی (Render Pipeline)
    // ----------------------------------------------------
    function gameLoop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        // محاسبه FPS
        frameCount++;
        fpsTimer += dt;
        if (fpsTimer >= 1.0) {
            fpsLabel.textContent = `FPS: ${frameCount}`;
            frameCount = 0;
            fpsTimer = 0;
        }

        // زمان بازی
        if (!GameState.isGameOver && !GameState.isLevelWon) {
            GameState.timeRemaining -= dt * 1.5;
            if (GameState.timeRemaining <= 0) {
                mario.die();
            }
        }

        // به‌روزرسانی وضعیت فیزیک ماریو
        if (!GameState.isGameOver && !GameState.isLevelWon) {
            mario.update(keys);

            // دنبال کردن دوربین نرم (Smooth Camera Lerp)
            const targetCamX = mario.x - 200;
            if (targetCamX > GameState.cameraX) {
                GameState.cameraX += (targetCamX - GameState.cameraX) * 0.1;
            }

            // چک برخورد دشمنان
            enemies.forEach(enemy => {
                enemy.update();
                if (!enemy.dead && !enemy.remove) {
                    if (
                        mario.x < enemy.x + enemy.width &&
                        mario.x + mario.width > enemy.x &&
                        mario.y < enemy.y + enemy.height &&
                        mario.y + mario.height > enemy.y
                    ) {
                        // استامپ کردن روی سر گومبا
                        if (mario.vy > 0 && mario.y + mario.height - mario.vy <= enemy.y + 12) {
                            enemy.dead = true;
                            mario.vy = -7; // جهش برگشتی
                            GameState.score += 100;
                            sound.playStomp();
                            setTimeout(() => { enemy.remove = true; }, 400);
                        } else if (mario.invulnerableTimer === 0) {
                            mario.die();
                        }
                    }
                }
            });
        }

        // رندرینگ کامل فریم
        render();

        requestAnimationFrame(gameLoop);
    }

    function render() {
        // پس‌زمینه آسمان
        ctx.fillStyle = '#5c94fc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-Math.floor(GameState.cameraX), 0);

        // ترسیم ابرها و تپه‌های بک‌گراند
        drawScenery();

        // ترسیم تایل‌های نقشه
        const startCol = Math.max(0, Math.floor(GameState.cameraX / TILE_SIZE));
        const endCol = Math.min(LEVEL_COLS, startCol + Math.ceil(canvas.width / TILE_SIZE) + 2);

        for (let r = 0; r < LEVEL_ROWS; r++) {
            for (let c = startCol; c < endCol; c++) {
                const tile = getTile(c, r);
                const tx = c * TILE_SIZE;
                const ty = r * TILE_SIZE;

                if (tile === 1) { // چمن
                    ctx.fillStyle = '#22c55e';
                    ctx.fillRect(tx, ty, TILE_SIZE, 6);
                    ctx.fillStyle = '#92400e';
                    ctx.fillRect(tx, ty + 6, TILE_SIZE, TILE_SIZE - 6);
                } else if (tile === 2) { // آجر
                    ctx.fillStyle = '#b45309';
                    ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#451a03';
                    ctx.strokeRect(tx + 1, ty + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                } else if (tile === 3) { // علامت سوال
                    ctx.fillStyle = '#eab308';
                    ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = '#713f12';
                    ctx.font = 'bold 16px Courier';
                    ctx.fillText('?', tx + 10, ty + 22);
                    ctx.strokeStyle = '#ca8a04';
                    ctx.strokeRect(tx + 1, ty + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                } else if (tile === 4) { // لوله
                    ctx.fillStyle = '#15803d';
                    ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#14532d';
                    ctx.strokeRect(tx, ty, TILE_SIZE, TILE_SIZE);
                } else if (tile === 5) { // میله پرچم
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillRect(tx + 14, ty, 4, TILE_SIZE);
                    if (r === 2) {
                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(tx - 10, ty, 24, 16);
                    }
                }
            }
        }

        // ترسیم دشمنان
        enemies.forEach(e => e.render(ctx));

        // ترسیم ماریو
        mario.render(ctx);

        ctx.restore();

        // ترسیم HUD ثابت بالای صفحه
        drawHUD();

        // پیام‌های وضعیت خاص (Game Over / Victory)
        if (GameState.isGameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f87171';
            ctx.font = 'bold 28px Courier';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = '14px Courier';
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText('کلید [R] را برای بازیابی بکاپ فشار دهید', canvas.width / 2, canvas.height / 2 + 25);
            ctx.textAlign = 'left';
        } else if (GameState.isLevelWon) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 28px Courier';
            ctx.textAlign = 'center';
            ctx.fillText('VICTORY! STAGE CLEARED', canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = '14px Courier';
            ctx.fillStyle = '#f1f5f9';
            ctx.fillText(`امتیاز نهایی: ${GameState.score}`, canvas.width / 2, canvas.height / 2 + 25);
            ctx.textAlign = 'left';
        }
    }

    function drawScenery() {
        // ابرها
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        for (let i = 0; i < 8; i++) {
            const cx = i * 450 + 60;
            ctx.beginPath();
            ctx.arc(cx, 70, 22, 0, Math.PI * 2);
            ctx.arc(cx + 20, 60, 28, 0, Math.PI * 2);
            ctx.arc(cx + 45, 70, 20, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawHUD() {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px Courier';
        ctx.fillText(`MARIO`, 30, 24);
        ctx.fillText(`${String(GameState.score).padStart(6, '0')}`, 30, 40);

        ctx.fillText(`COINS`, 170, 24);
        ctx.fillText(`🪙 × ${String(GameState.coins).padStart(2, '0')}`, 170, 40);

        ctx.fillText(`WORLD`, 320, 24);
        ctx.fillText(`${GameState.world}`, 330, 40);

        ctx.fillText(`TIME`, 460, 24);
        ctx.fillText(`${Math.max(0, Math.floor(GameState.timeRemaining))}`, 465, 40);

        ctx.fillText(`LIVES`, 560, 24);
        ctx.fillText(`❤️ × ${GameState.lives}`, 560, 40);
    }

    // استارت چرخه رندر
    requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
