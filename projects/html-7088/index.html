<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>Super Mario Bros - B2.st Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace, Arial;
        }

        #gameContainer {
            position: relative;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #gameCanvas {
            display: block;
            border: 2px solid #333;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #6b8cff;
        }

        #fpsCounter {
            position: absolute;
            top: 5px;
            left: 5px;
            color: #0f0;
            font-size: 10px;
            font-family: monospace;
            z-index: 100;
            display: none;

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 14px;
            z-index: 200;
        }

        #loadingScreen .progress-bar {
            width: 200px;
            height: 8px;
            background: #333;
            margin-top: 20px;

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="fpsCounter">FPS: 60</div>
        <div id="loadingScreen">
            <div>🍄 SUPER MARIO BROS</div>
            <div style="margin-top: 10px; font-size: 10px;">Loading...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <div class="controls-info">
        ← → حرکت | ↑ پرش | Space شلیک | P توقف | B2.st Studio
    </div>

    <!-- Config Module -->
    <script src="config/env_config.js"></script>

    <!-- Game Engine -->
    <script>
    (function() {
        'use strict';

        // ──────────────────────────────────────
        // انتظار برای آماده شدن EnvConfig
        // ──────────────────────────────────────
        function waitForConfig(callback) {
            if (window.GAME && window.GameConfig) {
                callback();
            } else {
                setTimeout(function() { waitForConfig(callback); }, 50);
            }
        }

        waitForConfig(function() {
            const CFG = window.GAME;
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const fpsCounter = document.getElementById('fpsCounter');
            const loadingScreen = document.getElementById('loadingScreen');
            const progressFill = document.getElementById('progressFill');

            // ── Canvas Setup ──
            canvas.width = CFG.canvas.width;
            canvas.height = CFG.canvas.height;
            canvas.style.width = (CFG.canvas.width * CFG.canvas.scale) + 'px';
            canvas.style.height = (CFG.canvas.height * CFG.canvas.scale) + 'px';

            if (CFG.display.showFps) {
                fpsCounter.style.display = 'block';
            }

            // ── Game State ──
            const STATE = {
                running: false,
                paused: false,
                lives: CFG.gameplay.initialLives,
                score: 0,
                coins: 0,
                level: 1,
                time: 400,
                lastTime: 0,
                deltaTime: 0,
                frameCount: 0,
                fps: 0,
                fpsTimer: 0
            };

            // ── Input Handler ──
            const KEYS = {};
            document.addEventListener('keydown', function(e) {
                KEYS[e.code] = true;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                    e.preventDefault();
                }
                if (e.code === 'KeyP') {
                    STATE.paused = !STATE.paused;
                }
            });
            document.addEventListener('keyup', function(e) {
                KEYS[e.code] = false;
            });

            // ── Player ──
            const player = {
                x: 50,
                y: 0,
                width: CFG.physics.tileSize,
                height: CFG.physics.tileSize,
                vx: 0,
                vy: 0,
                grounded: false,
                facing: 1,
                state: 'small', // small, big, fire
                invincible: false,
                invincibleTimer: 0,
                animFrame: 0,
                animTimer: 0
            };

            // ── Level Data (World 1-1 simplified) ──
            const TILE = CFG.physics.tileSize;
            const COLS = Math.ceil(CFG.canvas.width / TILE);
            const ROWS = Math.ceil(CFG.canvas.height / TILE);

            // ساده‌ترین نقشه ماریو
            const levelMap = [];
            for (let r = 0; r < ROWS; r++) {
                levelMap[r] = [];
                for (let c = 0; c < COLS * 4; c++) {
                    if (r >= ROWS - 2) {
                        levelMap[r][c] = 1; // زمین
                    } else if (r === ROWS - 3 && (c === 16 || c === 20 || c === 21 || c === 22 || c === 23)) {
                        levelMap[r][c] = 2; // بلوک سوال
                    } else if (r === ROWS - 6 && c >= 28 && c <= 31) {
                        levelMap[r][c] = 1; // پلتفرم
                    } else if (r >= ROWS - 5 && r < ROWS - 2 && c === 40) {
                        levelMap[r][c] = 1; // لوله (ستون)
                    } else if (r >= ROWS - 6 && r < ROWS - 2 && c === 41) {
                        levelMap[r][c] = 1; // لوله (ستون)
                    } else {
                        levelMap[r][c] = 0; // خالی
                    }
                }
            }

            // حفره
            for (let c = 35; c <= 37; c++) {
                levelMap[ROWS - 2][c] = 0;
                levelMap[ROWS - 1][c] = 0;
            }

            player.y = (ROWS - 3) * TILE;

            // ── Camera ──
            const camera = { x: 0, y: 0 };

            // ── Colors ──
            const COLORS = {
                sky: '#6b8cff',
                ground: '#c84c0c',
                groundDark: '#a0380c',
                brick: '#c84c0c',
                question: '#e4a010',
                questionDark: '#c88000',
                pipe: '#00a800',
                pipeDark: '#008000',
                player: '#e44d26',
                playerPants: '#2020c0',
                coin: '#ffd700',
                text: '#ffffff',
                hud: '#ffffff'
            };

            // ── Particles ──
            const particles = [];

            function spawnParticle(x, y, color) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -Math.random() * 5 - 2,
                    life: 30,
                    color: color || COLORS.coin,
                    size: 2
                });
            }

            // ── Collision Detection ──
            function getTile(col, row) {
                if (row < 0 || row >= ROWS || col < 0) return 0;
                if (col >= levelMap[0].length) return 0;
                return levelMap[row] ? (levelMap[row][col] || 0) : 0;
            }

            function isSolid(col, row) {
                const tile = getTile(col, row);
                return tile === 1 || tile === 2;
            }

            // ── Physics Update ──
            function updatePlayer(dt) {
                // Horizontal input
                if (KEYS['ArrowLeft'] || KEYS['KeyA']) {
                    player.vx -= CFG.player.acceleration;
                    player.facing = -1;
                } else if (KEYS['ArrowRight'] || KEYS['KeyD']) {
                    player.vx += CFG.player.acceleration;
                    player.facing = 1;
                } else {
                    player.vx *= (1 - CFG.player.deceleration);
                    if (Math.abs(player.vx) < 0.1) player.vx = 0;
                }

                // Clamp horizontal speed
                player.vx = Math.max(-CFG.player.speed, Math.min(CFG.player.speed, player.vx));

                // Jump
                if ((KEYS['ArrowUp'] || KEYS['KeyW'] || KEYS['Space']) && player.grounded) {
                    player.vy = CFG.player.jumpForce;
                    player.grounded = false;
                }

                // Gravity
                player.vy += CFG.physics.gravity;
                player.vy = Math.min(player.vy, CFG.player.maxFallSpeed);

                // Horizontal collision
                player.x += player.vx;
                const leftCol = Math.floor(player.x / TILE);
                const rightCol = Math.floor((player.x + player.width - 1) / TILE);
                const topRow = Math.floor(player.y / TILE);
                const bottomRow = Math.floor((player.y + player.height - 1) / TILE);

                if (player.vx > 0) {
                    if (isSolid(rightCol, topRow) || isSolid(rightCol, bottomRow)) {
                        player.x = rightCol * TILE - player.width;
                        player.vx = 0;
                    }
                } else if (player.vx < 0) {
                    if (isSolid(leftCol, topRow) || isSolid(leftCol, bottomRow)) {
                        player.x = (leftCol + 1) * TILE;
                        player.vx = 0;
                    }
                }

                // Vertical collision
                player.y += player.vy;
                const newTopRow = Math.floor(player.y / TILE);
                const newBottomRow = Math.floor((player.y + player.height - 1) / TILE);
                const newLeftCol = Math.floor(player.x / TILE);
                const newRightCol = Math.floor((player.x + player.width - 1) / TILE);

                player.grounded = false;

                if (player.vy > 0) {
                    if (isSolid(newLeftCol, newBottomRow) || isSolid(newRightCol, newBottomRow)) {
                        player.y = newBottomRow * TILE - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                } else if (player.vy < 0) {
                    if (isSolid(newLeftCol, newTopRow) || isSolid(newRightCol, newTopRow)) {
                        player.y = (newTopRow + 1) * TILE;
                        player.vy = 0;

                        // بلوک سوال
                        const hitCol = newLeftCol;
                        if (getTile(hitCol, newTopRow) === 2) {
                            levelMap[newTopRow][hitCol] = 3; // used
                            STATE.coins++;
                            STATE.score += 200;
                            spawnParticle(hitCol * TILE + TILE / 2, newTopRow * TILE, COLORS.coin);
                        }
                    }
                }

                // سقوط از نقشه
                if (player.y > ROWS * TILE) {
                    STATE.lives--;
                    if (STATE.lives <= 0) {
                        STATE.running = false;
                    } else {
                        player.x = 50;
                        player.y = (ROWS - 3) * TILE;
                        player.vx = 0;
                        player.vy = 0;
                        camera.x = 0;
                    }
                }

                // محدودیت سمت چپ
                if (player.x < camera.x) player.x = camera.x;

                // Invincibility timer
                if (player.invincible) {
                    player.invincibleTimer -= dt;
                    if (player.invincibleTimer <= 0) {
                        player.invincible = false;
                    }
                }

                // Animation
                player.animTimer += dt;
                if (player.animTimer > 100) {
                    player.animFrame = (player.animFrame + 1) % 3;
                    player.animTimer = 0;
                }
            }

            // ── Camera Update ──
            function updateCamera() {
                const targetX = player.x - CFG.canvas.width / 3;
                camera.x = Math.max(camera.x, targetX);
                camera.x = Math.max(0, camera.x);
            }

            // ── Particles Update ──
            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.life--;
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }

            // ── Render ──
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // آسمان
                ctx.fillStyle = COLORS.sky;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // ابرها (ساده)
                ctx.fillStyle = '#ffffff';
                drawCloud(100 - camera.x * 0.3, 40, 40);
                drawCloud(300 - camera.x * 0.3, 60, 30);
                drawCloud(550 - camera.x * 0.3, 35, 35);

                // تایل‌ها
                const startCol = Math.floor(camera.x / TILE);
                const endCol = startCol + COLS + 1;

                for (let r = 0; r < ROWS; r++) {
                    for (let c = startCol; c <= endCol; c++) {
                        const tile = getTile(c, r);
                        if (tile === 0) continue;

                        const drawX = c * TILE - camera.x;
                        const drawY = r * TILE;

                        switch (tile) {
                            case 1: // زمین/آجر
                                ctx.fillStyle = COLORS.ground;
                                ctx.fillRect(drawX, drawY, TILE, TILE);
                                ctx.fillStyle = COLORS.groundDark;
                                ctx.fillRect(drawX, drawY + TILE - 2, TILE, 2);
                                // خطوط آجر
                                ctx.strokeStyle = COLORS.groundDark;
                                ctx.lineWidth = 0.5;
                                ctx.strokeRect(drawX + 0.5, drawY + 0.5, TILE - 1, TILE - 1);
                                break;

                            case 2: // بلوک سوال
                                ctx.fillStyle = COLORS.question;
                                ctx.fillRect(drawX, drawY, TILE, TILE);
                                ctx.fillStyle = COLORS.questionDark;
                                ctx.fillRect(drawX + 2, drawY + 2, TILE - 4, TILE - 4);
                                ctx.fillStyle = '#fff';
                                ctx.font = (TILE - 4) + 'px monospace';
                                ctx.textAlign = 'center';
                                ctx.fillText('?', drawX + TILE / 2, drawY + TILE - 3);
                                break;

                            case 3: // بلوک استفاده‌شده
                                ctx.fillStyle = '#8a6c3c';
                                ctx.fillRect(drawX, drawY, TILE, TILE);
                                ctx.strokeStyle = '#6a4c2c';
                                ctx.lineWidth = 0.5;
                                ctx.strokeRect(drawX + 0.5, drawY + 0.5, TILE - 1, TILE - 1);
                                break;
                        }
                    }
                }

                // بازیکن ماریو
                const px = player.x - camera.x;
                const py = player.y;

                if (!player.invincible || Math.floor(Date.now() / 100) % 2 === 0) {
                    // سر
                    ctx.fillStyle = COLORS.player;
                    ctx.fillRect(px + 2, py, TILE - 4, TILE / 2);

                    // بدن
                    ctx.fillStyle = COLORS.playerPants;
                    ctx.fillRect(px + 1, py + TILE / 2, TILE - 2, TILE / 2);

                    // چشم
                    ctx.fillStyle = '#fff';
                    const eyeX = player.facing > 0 ? px + TILE - 5 : px + 3;
                    ctx.fillRect(eyeX, py + 3, 2, 2);
                }

                // ذرات
                for (const p of particles) {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / 30;
                    ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
                }
                ctx.globalAlpha = 1;

                // HUD
                ctx.fillStyle = COLORS.hud;
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('MARIO', 20, 18);
                ctx.fillText(String(STATE.score).padStart(6, '0'), 20, 30);

                ctx.textAlign = 'center';
                ctx.fillText('🪙×' + STATE.coins, canvas.width / 2, 18);

                ctx.textAlign = 'center';
                ctx.fillText('WORLD', canvas.width / 2 + 80, 18);
                ctx.fillText('1-' + STATE.level, canvas.width / 2 + 80, 30);

                ctx.textAlign = 'right';
                ctx.fillText('TIME', canvas.width - 20, 18);
                ctx.fillText(String(Math.max(0, Math.floor(STATE.time))), canvas.width - 20, 30);

                ctx.textAlign = 'right';
                ctx.fillText('❤️×' + STATE.lives, canvas.width - 20, 48);

                // Hitbox debug
                if (CFG.display.showHitbox) {
                    ctx.strokeStyle = '#0f0';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(px, py, player.width, player.height);
                }

                // Pause overlay
                if (STATE.paused) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                    ctx.font = '10px monospace';
                    ctx.fillText('Press P to continue', canvas.width / 2, canvas.height / 2 + 25);
                }

                // Game Over
                if (!STATE.running && STATE.lives <= 0) {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#e44d26';
                    ctx.font = '24px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px monospace';
                    ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 30);
                }
            }

            function drawCloud(x, y, size) {
                ctx.beginPath();
                ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                ctx.arc(x + size * 0.4, y - size * 0.2, size / 2.5, 0, Math.PI * 2);
                ctx.arc(x + size * 0.8, y, size / 2.2, 0, Math.PI * 2);
                ctx.fill();
            }

            // ── Game Loop ──
            let lastTimestamp = 0;

            function gameLoop(timestamp) {
                if (!timestamp) timestamp = 0;
                const dt = timestamp - lastTimestamp;
                lastTimestamp = timestamp;

                // FPS counter
                STATE.frameCount++;
                STATE.fpsTimer += dt;
                if (STATE.fpsTimer >= 1000) {
                    STATE.fps = STATE.frameCount;
                    STATE.frameCount = 0;
                    STATE.fpsTimer = 0;
                    if (CFG.display.showFps) {
                        fpsCounter.textContent = 'FPS: ' + STATE.fps;
                    }
                }

                if (STATE.running && !STATE.paused) {
                    // Timer
                    STATE.time -= dt / 1000;
                    if (STATE.time <= 0) {
                        STATE.lives--;
                        if (STATE.lives <= 0) {
                            STATE.running = false;
                        } else {
                            STATE.time = 400;
                            player.x = 50;
                            player.y = (ROWS - 3) * TILE;
                            player.vx = 0;
                            player.vy = 0;
                            camera.x = 0;
                        }
                    }

                    updatePlayer(dt);
                    updateCamera();
                    updateParticles();
                }

                // Restart
                if (!STATE.running && KEYS['KeyR']) {
                    STATE.lives = CFG.gameplay.initialLives;
                    STATE.score = 0;
                    STATE.coins = 0;
                    STATE.time = 400;
                    STATE.running = true;
                    player.x = 50;
                    player.y = (ROWS - 3) * TILE;
                    player.vx = 0;
                    player.vy = 0;
                    camera.x = 0;
                }

                render();
                requestAnimationFrame(gameLoop);
            }

            // ── Start ──
            function startGame() {
                // شبیه‌سازی لودینگ
                let progress = 0;
                const loadInterval = setInterval(function() {
                    progress += Math.random() * 20 + 5;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(loadInterval);
                        setTimeout(function() {
                            loadingScreen.style.display = 'none';
                            STATE.running = true;
                            requestAnimationFrame(gameLoop);
                        }, 300);
                    }
                    progressFill.style.width = progress + '%';
                }, 150);
            }

            startGame();

            if (CFG.debug) {
                console.log('[Mario] 🎮 بازی با تنظیمات زیر شروع شد:');
                console.log('  Canvas:', CFG.canvas.width + 'x' + CFG.canvas.height);
                console.log('  Scale:', CFG.canvas.scale + 'x');
                console.log('  FPS Target:', CFG.display.fps);
                console.log('  Gravity:', CFG.physics.gravity);
                console.log('  Player Speed:', CFG.player.speed);
                console.log('  Lives:', CFG.gameplay.initialLives);
            }
        });
    })();
    </script>
</body>
</html>
