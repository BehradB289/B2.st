<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario - Zero Leak Engine [B2.st Studio]</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #11141a;
            color: #ecf0f1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(231, 76, 60, 0.2);
            border: 4px solid #2c3e50;
            border-radius: 8px;
            background: #5c94fc;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 800;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }
        #dashboard {
            margin-top: 15px;
            width: 800px;
            background: #1e272e;
            border-radius: 6px;
            padding: 10px 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            font-size: 13px;
            border: 1px solid #34495e;
            direction: ltr;
        }
        .metric-card {
            background: #2f3640;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid #e74c3c;
        }
        .metric-title {
            color: #95a5a6;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .metric-value {
            font-weight: bold;
            color: #00d2d3;
            font-family: monospace;
            font-size: 14px;
        }
        .controls-hint {
            margin-top: 10px;
            color: #7f8c8d;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div>MARIO: <span id="score-val">000000</span></div>
            <div>COINS: <span id="coin-val">x00</span></div>
            <div>FPS: <span id="fps-val">60</span></div>
            <div>STATE: <span id="state-val" style="color: #2ecc71;">STABLE</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div id="dashboard">
        <div class="metric-card">
            <div class="metric-title">JS Heap Allocation</div>
            <div class="metric-value" id="mem-heap">N/A</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Active Timers / RAF</div>
            <div class="metric-value" id="mem-timers">0 / 0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Recycled Pool Entities</div>
            <div class="metric-value" id="mem-pooled">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Active Enemies / Particles</div>
            <div class="metric-value" id="mem-entities">0</div>
        </div>
    </div>

    <div class="controls-hint">
        کلیدهای جهت‌نما یا A / D برای حرکت، W یا Space برای پرش | کلید R برای بازنشانی امن مرحله (Purge & Reset)
    </div>

    <!-- بارگذاری موتور محافظت حافظه B2.st -->
    <script src="src/core/memory_guard.js"></script>

    <!-- موتور بازی ماریو بدون نشت حافظه (Zero-Leak Mario Core) -->
    <script>
        'use strict';

        (function () {
            // ۱. راه‌اندازی نگهبان حافظه
            const guard = new MemoryGuard({
                debugMode: true,
                maxHeapThresholdMB: 150,
                alertThresholdMB: 100
            });

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d', { alpha: false }); // غیرفعال کردن alpha برای شتاب‌بخشی سخت‌افزاری

            // المنت‌های HUD
            const scoreVal = document.getElementById('score-val');
            const coinVal = document.getElementById('coin-val');
            const fpsVal = document.getElementById('fps-val');
            const memHeap = document.getElementById('mem-heap');
            const memTimers = document.getElementById('mem-timers');
            const memPooled = document.getElementById('mem-pooled');
            const memEntities = document.getElementById('mem-entities');

            // وضعیت ورودی‌ها
            const keys = { right: false, left: false, jump: false };

            // تنظیم استخر ذرات (Particle Pool) برای جلوگیری از allocation در هنگام دویدن و انفجار
            guard.registerPool(
                'particles',
                [],
                () => ({ x: 0, y: 0, vx: 0, vy: 0, size: 4, life: 1, color: '#f39c12' }),
                (p) => { p.life = 1; p.vx = 0; p.vy = 0; }
            );

            // کلاس ایزوله ماریو
            class Player {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = 80;
                    this.y = 330;
                    this.w = 28;
                    this.h = 36;
                    this.vx = 0;
                    this.vy = 0;
                    this.speed = 4.2;
                    this.jumpForce = -11.5;
                    this.gravity = 0.52;
                    this.grounded = false;
                    this.score = 0;
                    this.coins = 0;
                }

                update() {
                    if (keys.right) this.vx = this.speed;
                    else if (keys.left) this.vx = -this.speed;
                    else this.vx *= 0.78; // اصطکاک

                    if (keys.jump && this.grounded) {
                        this.vy = this.jumpForce;
                        this.grounded = false;
                        spawnDust(this.x + this.w / 2, this.y + this.h);
                    }

                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;

                    // برخورد با زمین
                    if (this.y >= 350) {
                        this.y = 350;
                        this.vy = 0;
                        this.grounded = true;
                    }

                    // مهار خروج از کادر
                    if (this.x < 0) this.x = 0;
                    if (this.x > canvas.width - this.w) this.x = canvas.width - this.w;
                }

                render(context) {
                    context.fillStyle = '#e74c3c'; // کلاه و لباس
                    context.fillRect(this.x, this.y, this.w, this.h);
                    context.fillStyle = '#2980b9'; // اورال آبی
                    context.fillRect(this.x + 4, this.y + 18, this.w - 8, 18);
                    context.fillStyle = '#f1c40f'; // سگک زرد
                    context.fillRect(this.x + 8, this.y + 22, 4, 4);
                    context.fillRect(this.x + 16, this.y + 22, 4, 4);
                }
            }

            // کلاس گومبا (Goomba) با متد چرخه حیات تمیز
            class Goomba {
                constructor(x) {
                    this.x = x;
                    this.y = 356;
                    this.w = 26;
                    this.h = 26;
                    this.vx = -1.2;
                    this.isDead = false;
                }

                update() {
                    this.x += this.vx;
                    if (this.x < -40) {
                        this.x = canvas.width + Math.random() * 200;
                    }
                }

                render(context) {
                    if (this.isDead) return;
                    context.fillStyle = '#795548';
                    context.fillRect(this.x, this.y, this.w, this.h);
                    context.fillStyle = '#ffffff';
                    context.fillRect(this.x + 4, this.y + 4, 5, 5);
                    context.fillRect(this.x + 16, this.y + 4, 5, 5);
                    context.fillStyle = '#000';
                    context.fillRect(this.x + 6, this.y + 6, 2, 2);
                    context.fillRect(this.x + 18, this.y + 6, 2, 2);
                }

                dispose() {
                    this.isDead = true;
                }
            }

            // متغیرهای وضعیت بازی
            const player = new Player();
            let enemies = [];
            let activeParticles = [];
            let lastTime = performance.now();
            let frames = 0;
            let fpsLastCheck = performance.now();

            function initWorld() {
                // پاک‌سازی تمامی ارجاعات قبلی
                enemies.forEach(e => e.dispose());
                enemies.length = 0;

                // بازگردانی ذرات به استخر
                for (let i = 0; i < activeParticles.length; i++) {
                    guard.releaseToPool('particles', activeParticles[i]);
                }
                activeParticles.length = 0;

                // ایجاد دشمن‌ها
                enemies.push(new Goomba(500));
                enemies.push(new Goomba(750));
                enemies.push(new Goomba(1050));
            }

            function spawnDust(x, y) {
                for (let i = 0; i < 4; i++) {
                    const p = guard.obtainFromPool('particles');
                    p.x = x;
                    p.y = y;
                    p.vx = (Math.random() - 0.5) * 3;
                    p.vy = -Math.random() * 2.5;
                    p.life = 1.0;
                    activeParticles.push(p);
                }
            }

            // لیسنرهای کیبورد با safeAddEventListener
            guard.safeAddEventListener(window, 'keydown', (e) => {
                if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
                if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.jump = true;
                if (e.code === 'KeyR') {
                    // شبیه‌سازی ریست مرحله با تخلیه صفر نشت
                    guard.sceneTransitionPurge();
                    player.reset();
                    initWorld();
                }
            });

            guard.safeAddEventListener(window, 'keyup', (e) => {
                if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
                if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.jump = false;
            });

            // تایمر دوره‌ای امن برای مانیتور وضعیت سلامت رم و هیپ
            guard.safeInterval(() => {
                guard.checkMemoryUsage();
                const metrics = guard.getMetrics();

                memTimers.innerText = `${metrics.activeTimeouts + metrics.activeIntervals} / ${metrics.activeRAF}`;
                memPooled.innerText = `${metrics.reclaimedEntitiesCount}`;
                memEntities.innerText = `${enemies.length} / ${activeParticles.length}`;

                if (window.performance && window.performance.memory) {
                    memHeap.innerText = `${metrics.lastHeapSizeMB} MB`;
                } else {
                    memHeap.innerText = "N/A (Non-Chromium)";
                }
            }, 500);

            // تایمر افزایش سکه و امتیاز جهت شبیه‌سازی منطق بازی
            guard.safeInterval(() => {
                player.score += 10;
                scoreVal.innerText = String(player.score).padStart(6, '0');
            }, 1000);

            // حلقه اصلی رندر و آپدیت با گارد ضد خفگی (Delta-Time Cap & Safe RAF)
            function gameLoop(timestamp) {
                const delta = Math.min(timestamp - lastTime, 33.3); // سقف فریم برای جلوگیری از افت حافظه تجمعی
                lastTime = timestamp;

                // محاسبه FPS
                frames++;
                if (timestamp - fpsLastCheck >= 1000) {
                    fpsVal.innerText = frames;
                    frames = 0;
                    fpsLastCheck = timestamp;
                }

                // ۱. منطق بازی (Update)
                player.update();

                for (let i = 0; i < enemies.length; i++) {
                    const e = enemies[i];
                    e.update();

                    // برخورد ساده ماریو با دشمن (له کردن یا مرگ)
                    if (Math.abs(player.x - e.x) < 24 && Math.abs(player.y - e.y) < 24) {
                        if (player.vy > 0 && player.y < e.y) {
                            // له شدن گومبا
                            e.x = canvas.width + 100;
                            player.vy = -7;
                            player.score += 100;
                            player.coins += 1;
                            coinVal.innerText = `x${String(player.coins).padStart(2, '0')}`;
                            spawnDust(e.x, e.y);
                        } else {
                            // برخورد معمولی
                            player.reset();
                        }
                    }
                }

                // به‌روزرسانی ذرات با استفاده مجدد از آبجکت‌ها
                for (let i = activeParticles.length - 1; i >= 0; i--) {
                    const p = activeParticles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.04;

                    if (p.life <= 0) {
                        guard.releaseToPool('particles', p);
                        // Swap and pop سریع برای حذف O(1) بدون جابجایی کل آرایه در رم
                        activeParticles[i] = activeParticles[activeParticles.length - 1];
                        activeParticles.pop();
                    }
                }

                // ۲. رندرسازی (Render)
                ctx.fillStyle = '#5c94fc'; // آسمان ماریو
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // زمین
                ctx.fillStyle = '#228b22';
                ctx.fillRect(0, 386, canvas.width, 14);
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(0, 400, canvas.width, 50);

                // ابرها و دکور
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fillRect(120, 80, 80, 24);
                ctx.fillRect(450, 110, 110, 28);

                // رندر موجودیت‌ها
                player.render(ctx);
                for (let i = 0; i < enemies.length; i++) {
                    enemies[i].render(ctx);
                }

                // رندر ذرات
                for (let i = 0; i < activeParticles.length; i++) {
                    const p = activeParticles[i];
                    ctx.fillStyle = `rgba(243, 156, 18, ${p.life})`;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }

                // درخواست فریم بعد توسط گارد امن
                guard.safeRAF(gameLoop);
            }

            // آغاز اجرای بدون نشت
            initWorld();
            guard.safeRAF(gameLoop);
        })();
    </script>
</body>
</html>
