<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Bros - B2.st High-Performance Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="arcade-cabinet">
        <header class="retro-header">
            <div class="hud-item">
                <span class="hud-label">MARIO</span>
                <span id="hud-score" class="hud-value">000000</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">COINS</span>
                <span id="hud-coins" class="hud-value">x00</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">WORLD</span>
                <span class="hud-value">1-1</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">TIME</span>
                <span id="hud-time" class="hud-value">400</span>
            </div>
        </header>

        <div class="screen-wrapper">
            <canvas id="game-canvas"></canvas>
            <div class="crt-scanlines"></div>
        </div>

        <footer class="telemetry-bar">
            <div id="hud-cache-stats" class="telemetry-info">
                <span>INITIALIZING ENGINE...</span>
            </div>
        </footer>

        <!-- Mobile Touch Controls -->
        <div class="touch-controls">
            <div class="dpad">
                <button id="btn-left" class="touch-btn">◀</button>
                <button id="btn-right" class="touch-btn">▶</button>
            </div>
            <div class="actions">
                <button id="btn-run" class="touch-btn btn-round">B</button>
                <button id="btn-jump" class="touch-btn btn-round">A</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap ES6 Engine -->
    <script type="module">
        import { MarioGame } from '../src/main.js';

        window.addEventListener('DOMContentLoaded', () => {
            const game = new MarioGame('game-canvas');
            game.start();

            // Mobile Touch Event Bindings
            const bindTouch = (elemId, keyProp) => {
                const el = document.getElementById(elemId);
                if (!el) return;
                const activate = (e) => { e.preventDefault(); game.input.keys[keyProp] = true; };
                const deactivate = (e) => { e.preventDefault(); game.input.keys[keyProp] = false; };
                el.addEventListener('touchstart', activate);
                el.addEventListener('touchend', deactivate);
                el.addEventListener('mousedown', activate);
                el.addEventListener('mouseup', deactivate);
            };

            bindTouch('btn-left', 'left');
            bindTouch('btn-right', 'right');
            bindTouch('btn-jump', 'jump');
            bindTouch('btn-run', 'run');
        });
    </script>
</body>
</html>
