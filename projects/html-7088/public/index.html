<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B2.st Studio - Super Mario Modular Engine</title>
  <style>
    @font-face {
      font-family: 'NES_Font';
      src: local('Courier New'), monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0c10;
      color: #66fcf1;
      font-family: 'NES_Font', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    .retro-container {
      background: #1f2833;
      border: 4px solid #45a29e;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 0 25px rgba(102, 252, 241, 0.25);
      max-width: 820px;
      width: 100%;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 2px solid #45a29e;
      padding-bottom: 6px;
      font-size: 13px;
    }

    .canvas-wrapper {
      position: relative;
      background: #5c94fc; /* NES Sky Blue */
      border: 3px solid #000;
      overflow: hidden;
      aspect-ratio: 256 / 224;
      width: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* NES CRT Filter */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* HUD Bar */
    .hud-bar {
      display: flex;
      justify-content: space-around;
      background: #000;
      color: #fff;
      padding: 6px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-title {
      color: #c5a059;
      margin-bottom: 2px;
    }

    /* DB Controls & Action Panel */
    .db-controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .retro-btn {
      background: #0b0c10;
      color: #66fcf1;
      border: 2px solid #45a29e;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s ease-in-out;
      border-radius: 4px;
    }

    .retro-btn:hover {
      background: #45a29e;
      color: #0b0c10;
    }

    .retro-btn:active {
      transform: scale(0.96);
    }

    .system-log {
      margin-top: 10px;
      background: #000;
      color: #66fcf1;
      font-size: 11px;
      padding: 8px;
      height: 80px;
      overflow-y: auto;
      border: 1px solid #45a29e;
      border-radius: 4px;
      font-family: monospace;
      direction: ltr;
      text-align: left;
    }

    .badge-status {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      background: #45a29e;
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="retro-container">
    <header class="top-header">
      <div><strong>B2.ST ENGINE</strong> // SUPER MARIO ES6</div>
      <div id="db-status-badge" class="badge-status">DB INITIALIZING...</div>
    </header>

    <div class="hud-bar">
      <div class="hud-item">
        <span class="hud-title">MARIO</span>
        <span id="hud-score">000000</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">COINS</span>
        <span id="hud-coins">× 00</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">WORLD</span>
        <span id="hud-world">1-1</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">LIVES</span>
        <span id="hud-lives">× 03</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">TIME</span>
        <span id="hud-time">400</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <div class="crt-overlay"></div>
      <canvas id="gameCanvas" width="256" height="224"></canvas>
    </div>

    <div class="db-controls-grid">
      <button class="retro-btn" id="btn-quick-save">ذخیره امن (Slot 1)</button>
      <button class="retro-btn" id="btn-quick-load">بازیابی امن (Slot 1)</button>
      <button class="retro-btn" id="btn-tamper-test">تست دستکاری امنیتی</button>
      <button class="retro-btn" id="btn-high-score">ثبت امتیاز برتر</button>
      <button class="retro-btn" id="btn-export">خروجی بک‌آپ</button>
      <button class="retro-btn" id="btn-restore">بازیابی بک‌آپ</button>
    </div>

    <div class="system-log" id="console-output">
      [B2.st Kernel] Booting Super Mario Engine...
    </div>
  </div>

  <script type="module">
    import { dbInstance } from '../src/db/database_layer.js';
    import { PhysicsEngine } from '../src/engine/Physics.js';
    import { Camera } from '../src/engine/Camera.js';
    import { GameLoop } from '../src/engine/GameLoop.js';
    import { Mario } from '../src/entities/Mario.js';
    import { Level } from '../src/levels/Level.js';

    const logBox = document.getElementById('console-output');
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML = `[${time}] ${msg}<br/>` + logBox.innerHTML;
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Instantiate Subsystems
    const physics = new PhysicsEngine();
    const camera = new Camera(256, 224);
    const level = new Level(1, 1);
    const mario = new Mario(30, 192);

    const inputs = { left: false, right: false, jump: false };
    let timeRemaining = 400;
    let timerTick = 0;

    // Keyboard bindings
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') inputs.jump = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputs.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = false;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') inputs.jump = false;
    });

    // Game Update Step
    function update(dt) {
      physics.applyGravity(mario, dt);
      mario.update(dt, inputs);
      physics.resolvePlatformCollision(mario, level.platforms);
      camera.update(mario.pos.x, level.width);

      // Coins detection
      for (const coin of level.coins) {
        if (!coin.collected && Math.abs(mario.pos.x - coin.x) < 14 && Math.abs(mario.pos.y - coin.y) < 14) {
          coin.collected = true;
          mario.coins += 1;
          mario.score += 200;
        }
      }

      // Timer countdown
      timerTick += dt;
      if (timerTick >= 1.0) {
        timerTick = 0;
        timeRemaining = Math.max(0, timeRemaining - 1);
      }

      // Update HUD
      document.getElementById('hud-score').innerText = String(mario.score).padStart(6, '0');
      document.getElementById('hud-coins').innerText = `× ${String(mario.coins).padStart(2, '0')}`;
      document.getElementById('hud-lives').innerText = `× ${String(mario.lives).padStart(2, '0')}`;
      document.getElementById('hud-time').innerText = String(timeRemaining).padStart(3, '0');
    }

    // NES Canvas Renderer
    function render() {
      ctx.save();
      ctx.fillStyle = '#5c94fc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.translate(-camera.x, -camera.y);

      // Render Level Platforms
      for (const plat of level.platforms) {
        if (plat.type === 'ground') {
          ctx.fillStyle = '#c84c0c';
          ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
          ctx.fillStyle = '#00a800'; // Green top grass
          ctx.fillRect(plat.x, plat.y, plat.w, 4);
        } else if (plat.type === 'pipe') {
          ctx.fillStyle = '#00a800';
          ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
          ctx.strokeStyle = '#000';
          ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        } else {
          ctx.fillStyle = '#fc9838';
          ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
          ctx.strokeStyle = '#000';
          ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        }
      }

      // Render Coins
      for (const coin of level.coins) {
        if (!coin.collected) {
          ctx.fillStyle = '#fce400';
          ctx.beginPath();
          ctx.arc(coin.x + 6, coin.y + 6, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Render Mario
      ctx.fillStyle = '#e40058'; // Classic Mario Overalls Red
      ctx.fillRect(mario.pos.x, mario.pos.y, mario.width, mario.height);
      ctx.fillStyle = '#002870'; // Blue hat/shoes accents
      ctx.fillRect(mario.pos.x + 2, mario.pos.y + 10, mario.width - 4, 6);

      ctx.restore();
    }

    const loop = new GameLoop(update, render);

    // Initialize Database & Wiring
    async function initSystem() {
      try {
        await dbInstance.init();
        const health = await dbInstance.healthCheck();
        document.getElementById('db-status-badge').innerText = `DB v${health.migrationVersion} ONLINE`;
        document.getElementById('db-status-badge').style.background = '#45a29e';
        log(`Database mounted. Storage Used: ${health.storageQuota.usageMB || 0} MB`);
        loop.start();
      } catch (err) {
        document.getElementById('db-status-badge').innerText = 'DB ERROR';
        document.getElementById('db-status-badge').style.background = '#e40058';
        log(`Database Error: ${err.message}`);
      }
    }

    initSystem();

    // UI Event Listeners for Secure DB Actions
    document.getElementById('btn-quick-save').addEventListener('click', async () => {
      try {
        const statePayload = {
          slotId: 'slot_1',
          world: 1,
          level: 1,
          score: mario.score,
          coins: mario.coins,
          lives: mario.lives,
          timeRemaining,
          mario: mario.serialize()
        };
        const saved = await dbInstance.saveGameState(statePayload);
        log(`Save successful! HMAC Signature: ${saved._signature.slice(0, 16)}...`);
      } catch (e) {
        log(`Save Failed: ${e.message}`);
      }
    });

    document.getElementById('btn-quick-load').addEventListener('click', async () => {
      try {
        const state = await dbInstance.loadGameState('slot_1');
        if (!state) {
          log('Slot 1 is empty.');
          return;
        }
        mario.hydrate(state);
        timeRemaining = state.timeRemaining;
        camera.reset();
        log(`Loaded save state from slot_1 successfully!`);
      } catch (e) {
        log(`Load Error: ${e.message}`);
      }
    });

    document.getElementById('btn-tamper-test').addEventListener('click', async () => {
      try {
        // Intentionally tamper with state directly inside IndexedDB without updating hash
        await dbInstance.executeTransaction('save_states', 'readwrite', (stores) => {
          return new Promise((res, rej) => {
            const req = stores['save_states'].get('slot_1');
            req.onsuccess = () => {
              if (!req.result) return rej(new Error('Save slot_1 first before testing tamper!'));
              const corrupted = req.result;
              corrupted.score = 999999; // Tampered score!
              stores['save_states'].put(corrupted);
              res();
            };
          });
        });
        log('Manipulated memory: Score modified to 999999. Now attempting load...');
        await dbInstance.loadGameState('slot_1');
      } catch (e) {
        log(`Security Guard Caught Tamper! -> ${e.message}`);
      }
    });

    document.getElementById('btn-high-score').addEventListener('click', async () => {
      try {
        const res = await dbInstance.recordHighScore({
          playerName: 'MARIO_B2',
          score: mario.score + 1000,
          stage: '1-1',
          coins: mario.coins
        });
        log(`High score registered! Entry ID: ${res.id}`);
      } catch (e) {
        log(`Score Register Error: ${e.message}`);
      }
    });

    document.getElementById('btn-export').addEventListener('click', async () => {
      try {
        const json = await dbInstance.exportBackup();
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `b2st_mario_backup_${Date.now()}.json`;
        a.click();
        log('Backup export generated and downloaded.');
      } catch (e) {
        log(`Export failed: ${e.message}`);
      }
    });

    document.getElementById('btn-restore').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const text = await file.text();
        try {
          const res = await dbInstance.restoreBackup(text);
          log(`Backup restored! ${res.restoredRecords} records verified.`);
        } catch (err) {
          log(`Restore verification failed: ${err.message}`);
        }
      };
      input.click();
    });
  </script>
</body>
</html>
