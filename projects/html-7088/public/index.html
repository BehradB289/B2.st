<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Bros - B2.st ECS Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <!-- NES Classic HUD -->
        <div class="hud-bar">
            <div class="hud-group">
                <span class="hud-title">MARIO</span>
                <span id="score-val" class="hud-value">000000</span>
            </div>
            <div class="hud-group">
                <span class="hud-title">COINS</span>
                <span id="coins-val" class="hud-value">x00</span>
            </div>
            <div class="hud-group">
                <span class="hud-title">WORLD</span>
                <span class="hud-value">1-1</span>
            </div>
            <div class="hud-group">
                <span class="hud-title">TIME</span>
                <span id="time-val" class="hud-value">400</span>
            </div>
        </div>

        <!-- Render Target -->
        <canvas id="game-canvas" width="256" height="240"></canvas>

        <!-- CRT Filter -->
        <div class="crt-overlay"></div>

        <!-- On-Screen Virtual Gamepad for Mobile -->
        <div class="mobile-controls">
            <div class="d-pad">
                <button class="touch-btn" id="btn-left">◀</button>
                <button class="touch-btn" id="btn-right">▶</button>
            </div>
            <div class="action-pad">
                <button class="touch-btn" id="btn-sprint">B</button>
                <button class="touch-btn" id="btn-jump">A</button>
            </div>
        </div>
    </div>

    <!-- Live In-Memory Cache & Engine Stats -->
    <div class="telemetry-bar">
        <span>FPS: <strong id="stat-fps">60</strong></span>
        <span>CACHE HIT RATE: <strong id="stat-hitrate">0%</strong></span>
        <span>CACHE SIZE: <strong id="stat-cachesize">0</strong></span>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
