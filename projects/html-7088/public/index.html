<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B2.st Super Mario WebEngine - NES Edition</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --nes-font: 'Courier New', Courier, monospace;
      --gold: #fcd800;
      --accent: #e52521;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: var(--nes-font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Cabinet Shell */
    .arcade-wrapper {
      position: relative;
      background: #1a1e29;
      border: 4px solid #2e384d;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(229, 37, 33, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* NES HUD Header */
    .hud {
      width: 100%;
      max-width: 768px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 2px 2px #000;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-title {
      color: #fff;
      margin-bottom: 2px;
    }

    .hud-value {
      color: var(--gold);
    }

    /* Screen Container */
    .screen-container {
      position: relative;
      border: 4px solid #000;
      background-color: #5c94fc;
      overflow: hidden;
      border-radius: 4px;
    }

    canvas#gameCanvas {
      display: block;
      width: 768px;
      height: 720px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* CRT Scanlines Filter Overlay */
    .crt-overlay {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 6px 100%;
    }

    /* Navigation Bar */
    .meta-bar {
      margin-top: 14px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
    }

    .swagger-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #34d399;
    }

    .swagger-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    /* Mobile Virtual Controls */
    .virtual-controls {
      display: none;
      width: 100%;
      max-width: 768px;
      justify-content: space-between;
      margin-top: 15px;
    }

    .dpad, .action-buttons {
      display: flex;
      gap: 12px;
    }

    .touch-btn {
      background: #2a3447;
      border: 2px solid #475569;
      color: #fff;
      font-family: inherit;
      font-weight: bold;
      font-size: 16px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .touch-btn:active {
      background: var(--accent);
    }

    @media (max-width: 820px) {
      canvas#gameCanvas {
        width: 100vw;
        max-width: 100vw;
        height: auto;
        aspect-ratio: 256 / 240;
      }
      .arcade-wrapper {
        border-radius: 0;
        border: none;
        padding: 8px;
      }
      .virtual-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <div class="arcade-wrapper">
    <!-- NES HUD -->
    <div class="hud">
      <div class="hud-item">
        <span class="hud-title">MARIO</span>
        <span class="hud-value" id="hud-score">000000</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">COINS</span>
        <span class="hud-value" id="hud-coins">🪙 x00</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">WORLD</span>
        <span class="hud-value" id="hud-world">1-1</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">TIME</span>
        <span class="hud-value" id="hud-time">400</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">LIVES</span>
        <span class="hud-value" id="hud-lives">❤ 3</span>
      </div>
    </div>

    <!-- Screen Canvas -->
    <div class="screen-container">
      <canvas id="gameCanvas" width="256" height="240"></canvas>
      <div class="crt-overlay"></div>
    </div>

    <!-- Metadata and Docs Link -->
    <div class="meta-bar">
      <div>Controls: <b>[A/D] or [Arrows]</b> Move | <b>[W/Space]</b> Jump | <b>[Shift]</b> Run | <b>[P]</b> Pause | <b>[M]</b> Mute</div>
      <a href="/swagger.html" class="swagger-btn" target="_blank">
        ⚡ Interactive OpenAPI / Swagger Docs
      </a>
    </div>

    <!-- Mobile Virtual Controls -->
    <div class="virtual-controls">
      <div class="dpad">
        <button class="touch-btn" id="btn-left">◀</button>
        <button class="touch-btn" id="btn-right">▶</button>
      </div>
      <div class="action-buttons">
        <button class="touch-btn" id="btn-run" style="background: #3b82f6;">B</button>
        <button class="touch-btn" id="btn-jump" style="background: #ef4444;">A</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { Game } from './src/engine/Game.js';

    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const game = new Game(canvas);
      game.start();

      // HUD Sync Loop
      const hudScore = document.getElementById('hud-score');
      const hudCoins = document.getElementById('hud-coins');
      const hudWorld = document.getElementById('hud-world');
      const hudTime = document.getElementById('hud-time');
      const hudLives = document.getElementById('hud-lives');

      function updateHUD() {
        hudScore.textContent = game.score.toString().padStart(6, '0');
        hudCoins.textContent = `🪙 x${game.coins.toString().padStart(2, '0')}`;
        hudWorld.textContent = game.world;
        hudTime.textContent = Math.ceil(game.time).toString().padStart(3, '0');
        hudLives.textContent = `❤ ${game.lives}`;
        requestAnimationFrame(updateHUD);
      }
      requestAnimationFrame(updateHUD);

      // Virtual Touch Event Binding
      const bindBtn = (id, action) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          game.input.setVirtualAction(action, true);
        });
        btn.addEventListener('touchend', (e) => {
          e.preventDefault();
          game.input.setVirtualAction(action, false);
        });
        btn.addEventListener('mousedown', () => game.input.setVirtualAction(action, true));
        btn.addEventListener('mouseup', () => game.input.setVirtualAction(action, false));
      };

      bindBtn('btn-left', 'left');
      bindBtn('btn-right', 'right');
      bindBtn('btn-jump', 'jump');
      bindBtn('btn-run', 'run');
    });
  </script>
</body>
</html>
