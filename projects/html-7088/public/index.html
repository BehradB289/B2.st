<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Mario - B2.st NES Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 15px rgba(230, 92, 0, 0.4);
      border: 4px solid #444;
      border-radius: 8px;
      background: #5c94fc;
    }

    /* NES Classic HUD */
    #hud {
      width: 100%;
      height: 48px;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 11px;
      line-height: 1.5;
      text-transform: uppercase;
      border-bottom: 2px solid #222;
      z-index: 10;
    }

    .hud-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      color: #ffcccb;
      margin-bottom: 2px;
    }

    .hud-val {
      color: #fff;
      letter-spacing: 2px;
    }

    .coin-icon {
      color: #ffd700;
      animation: coinBlink 0.8s infinite alternate;
      display: inline-block;
      margin-right: 4px;
    }

    @keyframes coinBlink {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #5c94fc;
    }

    #controls-hint {
      margin-top: 10px;
      font-size: 9px;
      color: #888;
      text-align: center;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="hud">
      <div class="hud-col">
        <span class="hud-label">MARIO</span>
        <span id="score" class="hud-val">000000</span>
      </div>
      <div class="hud-col">
        <span class="hud-label">COINS</span>
        <span class="hud-val"><span class="coin-icon">●</span>x<span id="coins">00</span></span>
      </div>
      <div class="hud-col">
        <span class="hud-label">WORLD</span>
        <span class="hud-val">1-1</span>
      </div>
      <div class="hud-col">
        <span class="hud-label">TIME</span>
        <span id="time" class="hud-val">400</span>
      </div>
      <div class="hud-col">
        <span class="hud-label">LIVES</span>
        <span id="lives" class="hud-val">3</span>
      </div>
    </div>
    <canvas id="viewport" width="256" height="224"></canvas>
  </div>

  <div id="controls-hint">
    [A / D / ← / →] WALK/RUN &nbsp;|&nbsp; [SPACE / W / ↑] JUMP &nbsp;|&nbsp; B2.st STUDIO NES ENGINE
  </div>

  <script type="module">
    import { PhysicsEngine } from '../src/engine/PhysicsEngine.js';
    import { Camera } from '../src/engine/Camera.js';
    import { GameLoop } from '../src/engine/GameLoop.js';
    import { Mario } from '../src/entities/Mario.js';
    import { Goomba } from '../src/entities/Goomba.js';
    import { Coin } from '../src/entities/Coin.js';
    import { TileMap, TILE_TYPES } from '../src/levels/TileMap.js';

    // 8-bit Audio Synthesizer via Web Audio API (Zero external assets needed)
    class RetroSound {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playJump() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
      playStomp() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playCoin() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
        osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      }
    }

    const sound = new RetroSound();
    const canvas = document.getElementById('viewport');
    const ctx = canvas.getContext('2d');

    // Dynamic resolution scaling
    function resizeCanvas() {
      const scale = Math.min(
        Math.floor((window.innerWidth * 0.92) / 256),
        Math.floor((window.innerHeight * 0.8) / 224)
      ) || 2;
      canvas.style.width = `${256 * scale}px`;
      canvas.style.height = `${224 * scale}px`;
      document.getElementById('hud').style.width = `${256 * scale}px`;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Setup Engine & Entities
    const physics = new PhysicsEngine();
    const camera = new Camera(256, 224);
    const tileMap = new TileMap(16);
    const mario = new Mario(32, 160);

    // Build Demo World (Classic 1-1 style layout)
    for (let x = 0; x < 200; x++) {
      if (x < 65 || (x > 68 && x < 85) || x > 88) {
        tileMap.setTile(x, 12, TILE_TYPES.GROUND);
        tileMap.setTile(x, 13, TILE_TYPES.GROUND);
      }
    }
    // Mystery Blocks & Bricks
    tileMap.setTile(16, 8, TILE_TYPES.QUESTION);
    tileMap.setTile(20, 8, TILE_TYPES.BRICK);
    tileMap.setTile(21, 8, TILE_TYPES.QUESTION);
    tileMap.setTile(22, 8, TILE_TYPES.BRICK);
    tileMap.setTile(23, 8, TILE_TYPES.QUESTION);
    tileMap.setTile(24, 8, TILE_TYPES.BRICK);

    // Pipes
    tileMap.setTile(28, 10, TILE_TYPES.PIPE);
    tileMap.setTile(28, 11, TILE_TYPES.PIPE);
    tileMap.setTile(38, 9, TILE_TYPES.PIPE);
    tileMap.setTile(38, 10, TILE_TYPES.PIPE);
    tileMap.setTile(38, 11, TILE_TYPES.PIPE);

    const entities = [
      new Goomba(200, 176),
      new Goomba(340, 176),
      new Goomba(520, 176),
      new Coin(256, 128),
      new Coin(272, 128),
      new Coin(288, 128),
      new Coin(368, 112)
    ];

    // Controls
    const keys = {};
    window.addEventListener('keydown', (e) => {
      sound.init();
      keys[e.code] = true;
      if (['Space', 'KeyW', 'ArrowUp'].includes(e.code)) {
        if (mario.jump()) sound.playJump();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    let timeRemaining = 400;
    let timeAccumulator = 0;

    // Game Loop
    const loop = new GameLoop(
      (dt) => {
        // Handle Mario Input
        const isRunning = keys['ShiftLeft'] || keys['ShiftRight'];
        if (keys['KeyA'] || keys['ArrowLeft']) mario.moveLeft(dt, isRunning);
        if (keys['KeyD'] || keys['ArrowRight']) mario.moveRight(dt, isRunning);

        // Physics Integration & Map Collisions
        physics.integrate(mario, dt);
        physics.resolveTileMapCollisions(mario, tileMap);
        mario.updateState();

        // Screen boundary
        if (mario.pos.x < camera.pos.x) mario.pos.x = camera.pos.x;

        // Pit death
        if (mario.pos.y > 240) {
          mario.pos.set(32, 160);
          mario.vel.set(0, 0);
          mario.takeDamage();
        }

        // Entities update
        for (let i = entities.length - 1; i >= 0; i--) {
          const entity = entities[i];
          if (entity.type.startsWith('goomba')) {
            physics.integrate(entity, dt);
            physics.resolveTileMapCollisions(entity, tileMap);
            entity.update(dt);
          }

          // Entity interactions
          const event = physics.resolveEntityInteraction(mario, entity);
          if (event === 'goomba_stomped') {
            sound.playStomp();
          } else if (event === 'coin_collected') {
            sound.playCoin();
          }

          // Clean up completed squashed enemies
          if (entity.squashTimer <= 0 && !entity.isAlive && entity.type === 'goomba_squashed') {
            entities.splice(i, 1);
          }
        }

        camera.follow(mario);

        // Update timer
        timeAccumulator += dt;
        if (timeAccumulator >= 1) {
          timeRemaining = Math.max(0, timeRemaining - 1);
          timeAccumulator = 0;
        }

        // Update HUD
        document.getElementById('score').innerText = mario.score.toString().padStart(6, '0');
        document.getElementById('coins').innerText = mario.coins.toString().padStart(2, '0');
        document.getElementById('lives').innerText = mario.lives.toString();
        document.getElementById('time').innerText = timeRemaining.toString().padStart(3, '0');
      },
      () => {
        // Render Frame
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.translate(-Math.floor(camera.pos.x), 0);

        // Draw Scenery (Clouds & Bushes)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(120, 50, 16, 0, Math.PI * 2);
        ctx.arc(140, 45, 20, 0, Math.PI * 2);
        ctx.arc(160, 50, 16, 0, Math.PI * 2);
        ctx.fill();

        // Draw Tiles
        const startCol = Math.floor(camera.pos.x / 16);
        const endCol = startCol + 18;
        for (let x = startCol; x <= endCol; x++) {
          for (let y = 0; y < 14; y++) {
            const tile = tileMap.getTile(x, y);
            const px = x * 16;
            const py = y * 16;
            if (tile === TILE_TYPES.GROUND) {
              ctx.fillStyle = '#c84c0c';
              ctx.fillRect(px, py, 16, 16);
              ctx.fillStyle = '#fcb480';
              ctx.fillRect(px + 1, py + 1, 14, 2);
            } else if (tile === TILE_TYPES.BRICK) {
              ctx.fillStyle = '#b84418';
              ctx.fillRect(px, py, 16, 16);
              ctx.fillStyle = '#000';
              ctx.strokeRect(px + 0.5, py + 0.5, 15, 15);
            } else if (tile === TILE_TYPES.QUESTION) {
              ctx.fillStyle = '#fc9838';
              ctx.fillRect(px, py, 16, 16);
              ctx.fillStyle = '#fff';
              ctx.font = '10px "Press Start 2P"';
              ctx.fillText('?', px + 4, py + 12);
            } else if (tile === TILE_TYPES.PIPE) {
              ctx.fillStyle = '#00a800';
              ctx.fillRect(px, py, 16, 16);
              ctx.fillStyle = '#80d010';
              ctx.fillRect(px + 2, py, 3, 16);
            }
          }
        }

        // Draw Entities
        for (const entity of entities) {
          if (entity.type === 'coin' && !entity.collected) {
            ctx.fillStyle = '#fcbc3c';
            ctx.beginPath();
            ctx.ellipse(entity.pos.x + 7, entity.pos.y + 7, 5, 7, 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (entity.type === 'goomba') {
            ctx.fillStyle = '#a84400';
            ctx.beginPath();
            ctx.arc(entity.pos.x + 8, entity.pos.y + 7, 7, Math.PI, 0);
            ctx.rect(entity.pos.x + 1, entity.pos.y + 7, 14, 6);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillRect(entity.pos.x + 2, entity.pos.y + 13, 5, 3);
            ctx.fillRect(entity.pos.x + 9, entity.pos.y + 13, 5, 3);
          } else if (entity.type === 'goomba_squashed') {
            ctx.fillStyle = '#a84400';
            ctx.fillRect(entity.pos.x, entity.pos.y + 4, 16, 4);
          }
        }

        // Draw Mario
        ctx.fillStyle = mario.facing === 1 ? '#d82800' : '#d82800';
        ctx.fillRect(mario.pos.x + 3, mario.pos.y, 10, 6); // Hat
        ctx.fillStyle = '#fc9838';
        ctx.fillRect(mario.pos.x + 4, mario.pos.y + 6, 8, 4); // Face
        ctx.fillStyle = '#0028d8';
        ctx.fillRect(mario.pos.x + 3, mario.pos.y + 10, 10, 6); // Overalls

        ctx.restore();
      }
    );

    loop.start();
  </script>
</body>
</html>
