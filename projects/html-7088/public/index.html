<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2.st Super Mario - Physics & Engine Core Demo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Vazirmatn:wght@400;700&display=swap');

    :root {
      --nes-dark: #000000;
      --nes-white: #ffffff;
      --nes-red: #e52521;
      --nes-sky: #6b8cff;
      --nes-gold: #fbd000;
      --nes-green: #00a800;
      --nes-border: #444444;
      --crt-scanline: rgba(18, 16, 16, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121216;
      color: var(--nes-white);
      font-family: 'Press Start 2P', 'Vazirmatn', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
    }

    /* فریم رترو کابینت بازی */
    .arcade-chassis {
      background: #1c1d24;
      border: 4px solid #323546;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 960px;
      width: 100%;
    }

    /* نوار وضعیت کلاسیک NES HUD */
    .nes-hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 768px;
      padding: 0 12px 14px 12px;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--nes-white);
      text-shadow: 2px 2px #000;
      direction: ltr;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .hud-title {
      color: #ff9b3b;
    }

    /* کانتینر کانواس با افکت CRT */
    .canvas-wrapper {
      position: relative;
      border: 4px solid #000;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      background: var(--nes-sky);
      overflow: hidden;
      width: 768px;
      height: 480px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* اسکن‌لاین‌های مانیتور CRT */
    .canvas-wrapper::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    /* پنل اطلاعات فیزیک و دیباگ */
    .debug-dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 768px;
      margin-top: 18px;
      font-size: 10px;
      direction: ltr;
    }

    .stat-card {
      background: #0f1015;
      border: 2px solid #282a36;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-card span.label {
      color: #8be9fd;
    }

    .stat-card span.value {
      color: #50fa7b;
      font-size: 11px;
    }

    /* کنترل‌های فیزیک */
    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 768px;
      margin-top: 14px;
      padding: 12px;
      background: #171821;
      border: 1px solid #2f3244;
      border-radius: 8px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
    }

    input[type=range] {
      accent-color: var(--nes-red);
      cursor: pointer;
    }

    button.retro-btn {
      background: var(--nes-red);
      color: white;
      border: none;
      font-family: inherit;
      font-size: 10px;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 4px #8f1310;
      transition: all 0.1s ease;
    }

    button.retro-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px #8f1310;
    }

    .instructions {
      margin-top: 16px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 13px;
      color: #a0a5b5;
      text-align: center;
      line-height: 1.8;
    }

    .kbd {
      background: #2b2d3d;
      color: #f8f8f2;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #4a4d63;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      margin: 0 3px;
    }
  </style>
</head>
<body>

  <div class="arcade-chassis">
    <!-- NES HUD -->
    <div class="nes-hud">
      <div class="hud-item">
        <span class="hud-title">MARIO</span>
        <span id="hud-score">002450</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">COINS</span>
        <span id="hud-coins">🪙 x12</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">WORLD</span>
        <span>1 - 1</span>
      </div>
      <div class="hud-item">
        <span class="hud-title">TIME</span>
        <span id="hud-time">368</span>
      </div>
    </div>

    <!-- CANVAS VIEW -->
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="256" height="240"></canvas>
    </div>

    <!-- LIVE PHYSICS METRICS -->
    <div class="debug-dashboard">
      <div class="stat-card">
        <span class="label">ENGINE FPS</span>
        <span class="value" id="val-fps">60 FPS</span>
      </div>
      <div class="stat-card">
        <span class="label">MARIO VELOCITY (X, Y)</span>
        <span class="value" id="val-velocity">0.0, 0.0</span>
      </div>
      <div class="stat-card">
        <span class="label">PHYSICS STATE</span>
        <span class="value" id="val-state">GROUNDED</span>
      </div>
      <div class="stat-card">
        <span class="label">LAST EVENT</span>
        <span class="value" id="val-event">ENGINE_INIT</span>
      </div>
    </div>

    <!-- ADJUSTABLE CONTROLS -->
    <div class="controls-panel">
      <div class="control-group">
        <label for="slider-gravity">GRAVITY:</label>
        <input type="range" id="slider-gravity" min="400" max="1800" step="50" value="1050">
        <span id="label-gravity">1050</span>
      </div>

      <div class="control-group">
        <label for="slider-friction">FRICTION:</label>
        <input type="range" id="slider-friction" min="200" max="1600" step="50" value="950">
        <span id="label-friction">950</span>
      </div>

      <button class="retro-btn" id="btn-reset">RESPAWN MARIO</button>
      <button class="retro-btn" id="btn-pause" style="background:#555; box-shadow:0 4px #222;">PAUSE</button>
    </div>

    <div class="instructions">
      حرکت: <span class="kbd">◀ / ▶</span> یا <span class="kbd">A / D</span> |
      پرش: <span class="kbd">Space</span> یا <span class="kbd">Z</span> |
      دویدن سریع: <span class="kbd">Shift</span> یا <span class="kbd">X</span> |
      توقف: <span class="kbd">P</span> یا <span class="kbd">Esc</span>
    </div>
  </div>

  <!-- MODULE SCRIPT -->
  <script type="module">
    import { GameLoop } from '../src/engine/GameLoop.js';
    import { PhysicsEngine, RigidBody } from '../src/engine/Physics.js';
    import { InputHandler } from '../src/engine/InputHandler.js';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // عناصر دیباگ UI
    const valFps = document.getElementById('val-fps');
    const valVelocity = document.getElementById('val-velocity');
    const valState = document.getElementById('val-state');
    const valEvent = document.getElementById('val-event');
    const sliderGravity = document.getElementById('slider-gravity');
    const labelGravity = document.getElementById('label-gravity');
    const sliderFriction = document.getElementById('slider-friction');
    const labelFriction = document.getElementById('label-friction');
    const btnReset = document.getElementById('btn-reset');
    const btnPause = document.getElementById('btn-pause');

    // ۱. راه‌اندازی ماژول‌های موتور
    const input = new InputHandler(undefined, window);
    const physics = new PhysicsEngine({
      gravity: 1050,
      groundFriction: 950,
      terminalVelocity: 620
    });

    // ۲. ایجاد اشیاء دنیای بازی (موانع پلتفرم، آجرها و لوله سبز)
    // کف زمین اصلی
    physics.addObstacle(0, 208, 256, 32);
    // لوله سبز کلاسیک ماریو
    physics.addObstacle(160, 168, 32, 40);
    // بلوک‌های آجری و علامت سوال معلق
    physics.addObstacle(48, 144, 16, 16);
    physics.addObstacle(64, 144, 16, 16); // Mystery Block
    physics.addObstacle(80, 144, 16, 16);
    // سکوی مرتفع
    physics.addObstacle(112, 100, 32, 12);

    // ۳. انتیتی ماریو با خصوصیات RigidBody
    const mario = new RigidBody({
      id: 'mario',
      x: 32,
      y: 120,
      width: 14,
      height: 16
    });
    physics.addBody(mario);

    // ثبت گزارش رویدادهای فیزیکی در UI
    physics.on('land', () => {
      valEvent.textContent = 'EVENT: LANDED';
      valEvent.style.color = '#50fa7b';
    });
    physics.on('ceilingHit', () => {
      valEvent.textContent = 'EVENT: CEILING_HIT';
      valEvent.style.color = '#ff5555';
    });
    physics.on('wallHit', ({ side }) => {
      valEvent.textContent = `EVENT: WALL_HIT (${side.toUpperCase()})`;
      valEvent.style.color = '#ffb86c';
    });

    // پارامترهای حرکتی ماریو
    const MOVE_SPEED = 120;
    const RUN_SPEED = 180;
    const JUMP_FORCE = -340;

    // ۴. گام محاسبات منطق بازی (Update Step)
    function onUpdate(dt) {
      // کنترل افقی
      const isRunning = input.isDown('run');
      const targetSpeed = isRunning ? RUN_SPEED : MOVE_SPEED;

      if (input.isDown('left')) {
        mario.velocity.x = -targetSpeed;
        mario.facing = 'left';
      } else if (input.isDown('right')) {
        mario.velocity.x = targetSpeed;
        mario.facing = 'right';
      }

      // پرش (Jump) تنها زمانی که ماریو روی زمین است مجاز است
      if (input.isJustPressed('jump') && mario.isGrounded) {
        mario.applyImpulse(0, JUMP_FORCE);
        valEvent.textContent = 'EVENT: JUMP';
        valEvent.style.color = '#8be9fd';
      }

      // توقف با کلید Pause
      if (input.isJustPressed('pause')) {
        loop.togglePause();
      }

      // گام فیزیک
      physics.step(dt);

      // به‌روزرسانی وضعیت فریم‌های ورودی
      input.update();
    }

    // ۵. رندر گرافیکی (Render Pass)
    function onRender(alpha) {
      // پاک‌سازی با رنگ آسمان NES
      ctx.fillStyle = '#6b8cff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // رسم ابرها و کوه‌های پس‌زمینه
      drawScenery(ctx);

      // رسم موانع استاتیک
      for (const obs of physics.staticObstacles) {
        if (obs.top === 208) {
          // رسم زمین با بافت خاکی کلاسیک
          drawGround(ctx, obs);
        } else if (obs.width === 32 && obs.height === 40) {
          // رسم لوله سبز نینتندو
          drawPipe(ctx, obs);
        } else {
          // رسم بلوک آجری یا علامت سوال
          drawBlock(ctx, obs);
        }
      }

      // رسم ماریو
      drawMario(ctx, mario);

      // به‌روزرسانی پنل دیباگ
      valVelocity.textContent = `${mario.velocity.x.toFixed(1)}, ${mario.velocity.y.toFixed(1)}`;
      valState.textContent = mario.isGrounded ? 'GROUNDED' : (mario.velocity.y < 0 ? 'JUMPING' : 'FALLING');
    }

    // ۶. توابع ترسیم پیکسلی
    function drawScenery(ctx) {
      // کوه پس‌زمینه
      ctx.fillStyle = '#00a800';
      ctx.beginPath();
      ctx.moveTo(0, 208);
      ctx.lineTo(40, 160);
      ctx.lineTo(80, 208);
      ctx.fill();

      // ابر ساده
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(140, 40, 36, 12);
      ctx.fillRect(148, 34, 20, 6);
    }

    function drawGround(ctx, obs) {
      // بخش بالایی چمن/لبه
      ctx.fillStyle = '#d88b28';
      ctx.fillRect(obs.x, obs.y, obs.width, 4);
      // بافت خاک قهوه‌ای تیره
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(obs.x, obs.y + 4, obs.width, obs.height - 4);

      // الگوهای پیکسلی زمین
      ctx.fillStyle = '#000000';
      for (let x = 0; x < obs.width; x += 16) {
        ctx.fillRect(x, obs.y + 8, 2, 2);
        ctx.fillRect(x + 8, obs.y + 16, 2, 2);
      }
    }

    function drawPipe(ctx, obs) {
      // لبه دهانه لوله
      ctx.fillStyle = '#00a800';
      ctx.fillRect(obs.x - 2, obs.y, obs.width + 4, 12);
      ctx.fillStyle = '#80d010';
      ctx.fillRect(obs.x, obs.y + 2, 4, 8);
      ctx.fillStyle = '#005000';
      ctx.fillRect(obs.x + obs.width - 2, obs.y + 2, 4, 8);

      // بدنه اصلی لوله
      ctx.fillStyle = '#00a800';
      ctx.fillRect(obs.x, obs.y + 12, obs.width, obs.height - 12);
      ctx.fillStyle = '#80d010';
      ctx.fillRect(obs.x + 2, obs.y + 12, 4, obs.height - 12);
      ctx.fillStyle = '#005000';
      ctx.fillRect(obs.x + obs.width - 4, obs.y + 12, 4, obs.height - 12);
    }

    function drawBlock(ctx, obs) {
      ctx.fillStyle = '#fc9838';
      ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1;
      ctx.strokeRect(obs.x + 0.5, obs.y + 0.5, obs.width - 1, obs.height - 1);

      // علامت سوال یا بافت آجر
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(obs.x + 4, obs.y + 4, obs.width - 8, obs.height - 8);
    }

    function drawMario(ctx, m) {
      const x = Math.round(m.position.x);
      const y = Math.round(m.position.y);

      // پالت رنگی کاراکتر ماریو NES (قرمز، آبی، پوستی)
      // کلاه و لباس قرمز
      ctx.fillStyle = '#e52521';
      ctx.fillRect(x + 3, y, 8, 4); // کلاه
      ctx.fillRect(x + 2, y + 7, 10, 5); // بالاتنه پیراهن

      // صورت
      ctx.fillStyle = '#fcb070';
      ctx.fillRect(x + 3, y + 4, 8, 3);
      // سبیل
      ctx.fillStyle = '#000000';
      ctx.fillRect(x + (m.facing === 'left' ? 2 : 6), y + 5, 4, 2);

      // شلوارک و بند دوبنده آبی
      ctx.fillStyle = '#0020c0';
      ctx.fillRect(x + 3, y + 10, 8, 4);
      // پاها
      ctx.fillRect(x + 2, y + 14, 4, 2);
      ctx.fillRect(x + 8, y + 14, 4, 2);
    }

    // ۷. راه‌اندازی حلقه مرکزی بازی
    const loop = new GameLoop({
      targetFps: 60,
      onUpdate,
      onRender
    });

    loop.on('fps', (fps) => {
      valFps.textContent = `${fps} FPS`;
    });

    loop.on('pause', () => {
      btnPause.textContent = 'RESUME';
      btnPause.style.background = '#00a800';
    });

    loop.on('resume', () => {
      btnPause.textContent = 'PAUSE';
      btnPause.style.background = '#555';
    });

    // رویدادهای تعاملی فرم UI
    sliderGravity.addEventListener('input', (e) => {
      const val = Number(e.target.value);
      physics.gravity = val;
      labelGravity.textContent = val;
    });

    sliderFriction.addEventListener('input', (e) => {
      const val = Number(e.target.value);
      physics.groundFriction = val;
      labelFriction.textContent = val;
    });

    btnReset.addEventListener('click', () => {
      mario.position.set(32, 100);
      mario.velocity.zero();
      mario.acceleration.zero();
      valEvent.textContent = 'EVENT: RESPAWN';
      valEvent.style.color = '#f1fa8c';
    });

    btnPause.addEventListener('click', () => {
      loop.togglePause();
    });

    // استارت موتور
    loop.start();
  </script>
</body>
</html>
