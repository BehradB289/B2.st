<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:;">
    <title>Super Mario Bros - B2.st Hardened Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="320" height="240"></canvas>
        
        <!-- لایه کنترلی لمسی برای موبایل (بدون تداخل با تاچ اسکرول مرورگر) -->
        <div id="touch-controls">
            <div class="touch-cluster dpad">
                <button id="btn-left" class="t-btn" aria-label="Left">◀</button>
                <button id="btn-right" class="t-btn" aria-label="Right">▶</button>
            </div>
            <div class="touch-cluster action">
                <button id="btn-b" class="t-btn round" aria-label="Run">B</button>
                <button id="btn-a" class="t-btn round" aria-label="Jump">A</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
