<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Super Mario Canvas NES - Studio B2.st</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="crt-mode">
  <div id="arcade-cabinet">
    <!-- Header Toolbar -->
    <header id="arcade-toolbar">
      <span>STUDIO B2.st // NES-256</span>
      <div>
        <button id="btn-crt" class="hud-btn" title="Toggle Scanlines">CRT FX</button>
        <button id="btn-mute" class="hud-btn" title="Toggle Sound">🔊</button>
      </div>
    </header>

    <!-- Main Game Canvas Container with Screen Curvature / Scanlines -->
    <div id="screen-container">
      <canvas id="game-canvas" width="256" height="240"></canvas>
    </div>

    <!-- Responsive On-Screen Touch Controls (Mobile/Tablet) -->
    <div id="mobile-controls">
      <div class="touch-dpad">
        <button id="btn-left" class="touch-btn" style="grid-column: 1; grid-row: 2;">◀</button>
        <button id="btn-down" class="touch-btn" style="grid-column: 2; grid-row: 2;">▼</button>
        <button id="btn-right" class="touch-btn" style="grid-column: 3; grid-row: 2;">▶</button>
      </div>
      <div class="touch-actions">
        <button id="btn-fire" class="touch-btn action-btn">B</button>
        <button id="btn-jump" class="touch-btn action-btn">A</button>
      </div>
    </div>
  </div>

  <!-- Boot Module -->
  <script type="module" src="../src/main.js"></script>
</body>
</html>
