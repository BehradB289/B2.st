<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Mario HTML5 - B2.st Hardened Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #5c94fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
    }
    #game-container {
      border: 4px solid #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      background: #000;
    }
    canvas {
      display: block;
      background: #5c94fc;
      image-rendering: pixelated;
    }
    .hud {
      margin-top: 15px;
      font-size: 14px;
      color: #fce4a6;
      text-shadow: 2px 2px #000;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="marioCanvas" width="480" height="320"></canvas>
  </div>
  <div class="hud">Use Left / Right Arrows to Move | Space to Jump</div>

  <script>
    (function () {
      'use strict';
      const canvas = document.getElementById('marioCanvas');
      const ctx = canvas.getContext('2d');

      const gravity = 0.5;
      const friction = 0.8;

      const mario = {
        x: 50,
        y: 200,
        width: 24,
        height: 32,
        velX: 0,
        velY: 0,
        speed: 4,
        jumping: false,
        grounded: false,
        color: '#d82800'
      };

      const keys = {};

      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
      });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      function update() {
        if (keys['ArrowRight'] || keys['KeyD']) {
          if (mario.velX < mario.speed) mario.velX++;
        }
        if (keys['ArrowLeft'] || keys['KeyA']) {
          if (mario.velX > -mario.speed) mario.velX--;
        }
        if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && !mario.jumping && mario.grounded) {
          mario.jumping = true;
          mario.grounded = false;
          mario.velY = -10;
        }

        mario.velX *= friction;
        mario.velY += gravity;

        mario.grounded = false;
        mario.x += mario.velX;
        mario.y += mario.velY;

        // برخورد با کف زمین
        const groundLevel = canvas.height - 32;
        if (mario.y >= groundLevel - mario.height) {
          mario.y = groundLevel - mario.height;
          mario.jumping = false;
          mario.grounded = true;
          mario.velY = 0;
        }

        // محدودیت حرکت در صفحه
        if (mario.x <= 0) mario.x = 0;
        if (mario.x >= canvas.width - mario.width) mario.x = canvas.width - mario.width;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ترسیم زمین
        ctx.fillStyle = '#e45c10';
        ctx.fillRect(0, canvas.height - 32, canvas.width, 32);

        // خط حاشیه زمین
        ctx.fillStyle = '#00a800';
        ctx.fillRect(0, canvas.height - 32, canvas.width, 4);

        // ترسیم ماریو
        ctx.fillStyle = mario.color;
        ctx.fillRect(mario.x, mario.y, mario.width, mario.height);

        // کلاه و چشم ماریو
        ctx.fillStyle = '#fcbc3c';
        ctx.fillRect(mario.x + 4, mario.y + 6, 16, 8);
        ctx.fillStyle = '#000';
        ctx.fillRect(mario.x + 14, mario.y + 8, 3, 4);
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
