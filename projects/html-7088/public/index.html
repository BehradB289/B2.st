<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Mario Bros - Studio B2.st</title>
  <style>
    :root {
      --nes-bg: #101018;
      --nes-border: #44445a;
      --nes-accent: #f83800;
      --nes-gold: #fca044;
      --nes-cyan: #00e8d8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--nes-bg);
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    .retro-container {
      background: #1e1e28;
      border: 4px solid var(--nes-border);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }

    .top-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px dashed #3a3a50;
      padding-bottom: 8px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--nes-gold);
      letter-spacing: 1px;
    }

    .telemetry-badges {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
    }

    .badge {
      background: #2a2a3c;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #444460;
    }
    .badge span {
      color: var(--nes-cyan);
      font-weight: bold;
    }

    .canvas-wrapper {
      position: relative;
      background: #000;
      border: 3px solid #000000;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
      width: 100%;
      max-width: 768px;
      aspect-ratio: 384 / 240;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .control-toolbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: #2a2a3e;
      color: #fff;
      border: 2px solid #5a5a78;
      border-radius: 4px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #3e3e5c;
      border-color: var(--nes-gold);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* Mobile D-Pad and Action Buttons */
    .mobile-controls {
      display: none;
      width: 100%;
      max-width: 768px;
      margin-top: 16px;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    @media (max-width: 820px) {
      .mobile-controls {
        display: flex;
      }
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 48px);
      gap: 4px;
    }

    .dpad-btn {
      background: #2d2d42;
      border: 2px solid #555570;
      border-radius: 6px;
      color: #fff;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .action-group {
      display: flex;
      gap: 14px;
    }

    .act-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--nes-accent);
      border: 3px solid #ffffff;
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 4px 0 #800000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .act-btn.run-btn {
      background: var(--nes-gold);
      box-shadow: 0 4px 0 #945400;
    }

    .act-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #800000;
    }

    .instructions {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #9090aa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="retro-container">
    <header class="top-header">
      <div class="brand-title">B2.st :: SUPER MARIO NES</div>
      <div class="telemetry-badges">
        <div class="badge">FPS: <span id="fpsValue">60</span></div>
        <div class="badge">Cache Hit: <span id="cacheHitRate">100%</span></div>
        <div class="badge">Sprites: <span id="cacheSize">0 items</span></div>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="control-toolbar">
      <div>
        <button id="btnRestart" class="btn">🔄 Restart</button>
        <button id="btnPause" class="btn">⏸️ Pause</button>
      </div>
      <div>
        <button id="btnSound" class="btn">🔊 Audio ON</button>
      </div>
    </div>

    <!-- Touch overlay controls for mobile devices -->
    <div class="mobile-controls">
      <div class="dpad">
        <div></div>
        <div></div>
        <div></div>
        <div id="touchLeft" class="dpad-btn">◀</div>
        <div id="touchDown" class="dpad-btn">▼</div>
        <div id="touchRight" class="dpad-btn">▶</div>
      </div>

      <div class="action-group">
        <div id="touchRun" class="act-btn run-btn">B</div>
        <div id="touchJump" class="act-btn">A</div>
      </div>
    </div>

    <footer class="instructions">
      KEYBOARD: [A / D / Arrows] Move &bull; [SPACE / W / Up] Jump &bull; [SHIFT / X] Sprint &bull; Powered by B2.st ECS Engine
    </footer>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
