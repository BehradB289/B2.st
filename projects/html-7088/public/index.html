<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros - B2.st Studio Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="arcade-wrapper">
        <div class="screen-container">
            <canvas id="gameCanvas" width="256" height="240"></canvas>
            <div class="scanlines"></div>
        </div>

        <div class="controls-hint">
            <span>حرکت: <span class="key-badge">A / D</span> یا <span class="key-badge">← / →</span></span>
            <span>پرش: <span class="key-badge">SPACE</span> یا <span class="key-badge">W</span></span>
            <span>دویدن سریع: <span class="key-badge">SHIFT</span></span>
        </div>
    </div>

    <!-- بارگذاری ماژولار موتور ES6 بازی -->
    <script type="module" src="../src/game.js"></script>
</body>
</html>
