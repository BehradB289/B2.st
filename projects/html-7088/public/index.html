<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B2.st — Classic NES Mario Engine</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="arcade-cabinet">
    <!-- Retro Scanlines & Vignette Filter Overlay -->
    <div class="crt-overlay"></div>

    <!-- NES Top HUD -->
    <header class="nes-hud">
      <div class="hud-item">
        <span class="hud-label">MARIO</span>
        <span class="hud-value" id="hudScore">000000</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">COINS</span>
        <span class="hud-value" id="hudCoins">x00</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">WORLD</span>
        <span class="hud-value">1-1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">TIME</span>
        <span class="hud-value" id="hudTime">400</span>
      </div>
    </header>

    <!-- Canvas Frame -->
    <main class="screen-container">
      <canvas id="gameCanvas" width="256" height="240"></canvas>
    </main>

    <!-- Diagnostics & Engine HUD Footer -->
    <footer class="system-hud">
      <div class="stat-badge">FPS: <span id="hudFps" class="stat-val">60</span></div>
      <div class="stat-badge">CACHE: <span id="hudCacheHits" class="stat-val">100%</span></div>
      <div class="stat-badge">LIMITER: <span class="stat-val">ACTIVE (5T)</span></div>
      <div class="controls-guide">Controls: [←/→] Walk &bull; [Shift/X] Run &bull; [Space/Z/↑] Jump</div>
    </footer>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
