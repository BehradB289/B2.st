<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B2.st Super Mario Bros - NES Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .nes-cabinet {
      background: #1f2833;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(92, 148, 252, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #45a29e;
      max-width: 95vw;
    }

    /* NES HUD Header */
    .hud {
      width: 100%;
      max-width: 768px;
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 11px;
      letter-spacing: 1px;
      line-height: 1.5;
      color: #ffffff;
      background: #000000;
      border: 2px solid #333333;
      margin-bottom: 8px;
    }

    .hud-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-title {
      color: #fc9838;
      margin-bottom: 2px;
    }

    /* Canvas کانتینر با نسبت ابعاد دقیق 4:3 و مقیاس پیکسلی تمیز */
    .viewport-container {
      position: relative;
      background-color: #000000;
      border: 3px solid #111111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas#gameCanvas {
      width: 768px;
      height: 720px;
      max-width: 90vw;
      max-height: 70vh;
      aspect-ratio: 256 / 240;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      background-color: #5c94fc;
    }

    /* کنترل‌های لمسی موبایل */
    .touch-controls {
      display: none;
      width: 100%;
      max-width: 768px;
      margin-top: 14px;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    @media (max-width: 820px) {
      .touch-controls {
        display: flex;
      }
      .hud {
        font-size: 9px;
      }
    }

    .dpad, .action-buttons {
      display: flex;
      gap: 10px;
    }

    .touch-btn {
      width: 54px;
      height: 54px;
      background: #2b3a4a;
      border: 3px solid #66fcf1;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: pointer;
      font-family: inherit;
    }

    .touch-btn:active {
      background: #66fcf1;
      color: #0b0c10;
      transform: scale(0.95);
    }

    .instructions {
      margin-top: 10px;
      font-size: 8px;
      color: #888888;
      text-align: center;
      line-height: 1.6;
    }

    .instructions span {
      color: #66fcf1;
    }
  </style>
</head>
<body>

  <div class="nes-cabinet">
    <!-- Retro NES HUD Display -->
    <div class="hud">
      <div class="hud-col">
        <span class="hud-title">MARIO</span>
        <span id="hud-score">000000</span>
      </div>
      <div class="hud-col">
        <span class="hud-title">COINS</span>
        <span id="hud-coins">🪙x00</span>
      </div>
      <div class="hud-col">
        <span class="hud-title">WORLD</span>
        <span>1-1</span>
      </div>
      <div class="hud-col">
        <span class="hud-title">TIME</span>
        <span id="hud-time">400</span>
      </div>
    </div>

    <!-- Active Canvas -->
    <div class="viewport-container">
      <canvas id="gameCanvas" width="256" height="240"></canvas>
    </div>

    <!-- Touch Controls for Mobile/Tablets -->
    <div class="touch-controls">
      <div class="dpad">
        <button class="touch-btn" id="btn-left">◀</button>
        <button class="touch-btn" id="btn-right">▶</button>
      </div>
      <div class="action-buttons">
        <button class="touch-btn" id="btn-run" style="border-color: #fc9838;">B</button>
        <button class="touch-btn" id="btn-jump" style="border-color: #e63946;">A</button>
      </div>
    </div>

    <div class="instructions">
      حرکت: <span>← / →</span> یا <span>A / D</span> | پرش: <span>Z / Space</span> | دویدن سریع: <span>X / Shift</span>
    </div>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
