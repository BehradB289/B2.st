<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros - B2.st Game Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="arcade-cabinet">
        <header class="arcade-header">
            <h1 class="glow-title">SUPER MARIO BROS.</h1>
            <span class="badge">B2.st ENGINE v2.0</span>
        </header>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="256" height="240"></canvas>
            <div class="scanlines"></div>
        </div>

        <footer class="arcade-controls">
            <div class="control-box">
                <span class="key-tag">A / D یا پیکان چپ/راست</span> حرکت و اینرسی
            </div>
            <div class="control-box">
                <span class="key-tag">Z / Space</span> پرش متغیر
            </div>
            <div class="control-box">
                <span class="key-tag">X / Shift</span> دویدن سریع (Run)
            </div>
            <div class="control-box">
                <span class="key-tag">P</span> ارتقا به Super Mario
            </div>
        </footer>
    </div>

    <script type="module">
        import { Game } from '../src/game.js';
        
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const game = new Game(canvas);
            game.start();
        });
    </script>
</body>
</html>
