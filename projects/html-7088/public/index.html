<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; audio-src 'self' data: blob:;">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5c94fc">
    <title>Super Mario - B2.st Hardened Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <header id="hud" aria-label="Game HUD">
            <div class="hud-item"><span class="hud-label">MARIO</span><span id="score">000000</span></div>
            <div class="hud-item"><span class="hud-label">COINS</span><span id="coins">x00</span></div>
            <div class="hud-item"><span class="hud-label">WORLD</span><span id="world">1-1</span></div>
            <div class="hud-item"><span class="hud-label">TIME</span><span id="time">400</span></div>
        </header>

        <main id="canvas-container">
            <canvas id="gameCanvas" width="320" height="240"></canvas>
            <div id="start-overlay" class="overlay">
                <div class="overlay-card">
                    <h1>SUPER MARIO</h1>
                    <p class="blink">TAP SCREEN OR PRESS ENTER TO START</p>
                    <small>B2.st Studio Certified - Zero Bug Engine</small>
                </div>
            </div>
        </main>

        <!-- Mobile Touch Controller -->
        <nav id="mobile-controls" class="touch-only" aria-label="Mobile Controls">
            <div class="dpad">
                <button type="button" id="btn-left" class="t-btn" aria-label="Left">◀</button>
                <button type="button" id="btn-right" class="t-btn" aria-label="Right">▶</button>
            </div>
            <div class="action-buttons">
                <button type="button" id="btn-run" class="t-btn action-b" aria-label="Run/Dash">B</button>
                <button type="button" id="btn-jump" class="t-btn action-a" aria-label="Jump">A</button>
            </div>
        </nav>
    </div>

    <script src="game.js"></script>
</body>
</html>
