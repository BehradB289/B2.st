<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2.st Super Mario - OpenAPI 3.0 Interactive Testing Console</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2226%22 font-size=%2224%22>🍄</text></svg>">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --text-main: #f8fafc;
      --primary: #ef4444;
      --emerald: #10b981;
    }

    body {
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Top Studio Header */
    .b2st-header {
      background: linear-gradient(90deg, #182234 0%, #0b1120 100%);
      border-bottom: 2px solid #334155;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-size: 24px;
      background: #dc2626;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.6);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-subtitle {
      font-size: 12px;
      color: #94a3b8;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn-play {
      background: #ef4444;
      color: #fff;
      border-color: #f87171;
    }

    .btn-play:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    .btn-raw {
      background: #334155;
      color: #cbd5e1;
      border-color: #475569;
    }

    .btn-raw:hover {
      background: #475569;
      color: #fff;
    }

    /* Swagger Dark Theme Customization */
    .swagger-ui {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .swagger-ui .info {
      margin: 20px 0;
    }

    .swagger-ui .info .title {
      color: #f1f5f9;
      font-family: inherit;
    }

    .swagger-ui .info p, .swagger-ui .info li {
      color: #cbd5e1;
    }

    .swagger-ui .scheme-container {
      background: var(--card-dark);
      box-shadow: none;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }

    .swagger-ui .opblock {
      background: #1e293b !important;
      border-color: #334155 !important;
      border-radius: 8px;
      margin-bottom: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .swagger-ui .opblock .opblock-summary-operation-id,
    .swagger-ui .opblock .opblock-summary-path,
    .swagger-ui .opblock .opblock-summary-description {
      color: #f8fafc !important;
    }

    .swagger-ui .opblock-description-wrapper p,
    .swagger-ui .response-col_status,
    .swagger-ui table thead tr th,
    .swagger-ui .parameter__name,
    .swagger-ui .parameter__type {
      color: #cbd5e1 !important;
    }

    .swagger-ui .responses-inner {
      background: #0f172a !important;
    }

    .swagger-ui select, .swagger-ui input[type=text] {
      background: #0f172a !important;
      color: #fff !important;
      border: 1px solid #475569 !important;
      border-radius: 4px;
    }

    .swagger-ui .btn.execute {
      background-color: #10b981 !important;
      border-color: #10b981 !important;
      color: #fff !important;
      font-weight: 700;
    }

    .swagger-ui .btn.btn-clear {
      color: #cbd5e1 !important;
      border-color: #475569 !important;
    }
  </style>
</head>
<body>

  <!-- Studio Header -->
  <header class="b2st-header">
    <div class="brand">
      <div class="brand-logo">🍄</div>
      <div>
        <div class="brand-title">B2.st Mario WebEngine API</div>
        <div class="brand-subtitle">Interactive OpenAPI 3.0 / Swagger Interactive Console</div>
      </div>
    </div>
    <div class="header-actions">
      <a href="../docs/openapi.json" target="_blank" class="btn btn-raw">📄 Raw OpenAPI JSON</a>
      <a href="./index.html" class="btn btn-play">🎮 Play Mario Canvas Game</a>
    </div>
  </header>

  <!-- Swagger UI Mount Target -->
  <div id="swagger-ui"></div>

  <!-- Swagger UI Core Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-standalone-preset.min.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      let specUrl = '../docs/openapi.json';

      // Smart mock fallback interceptor for local testing without server backend
      const interceptor = {
        responseInterceptor: (response) => {
          return response;
        },
        requestInterceptor: (req) => {
          // If request fails due to no backend, Swagger shows intuitive mock status
          return req;
        }
      };

      try {
        window.ui = SwaggerUIBundle({
          url: specUrl,
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: "BaseLayout",
          defaultModelsExpandDepth: 2,
          defaultModelExpandDepth: 2,
          docExpansion: "list",
          showExtensions: true,
          showCommonExtensions: true,
          requestInterceptor: interceptor.requestInterceptor,
          responseInterceptor: interceptor.responseInterceptor
        });
      } catch (err) {
        console.error("Failed to load Swagger specification", err);
      }
    });
  </script>
</body>
</html>
