<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2.st Test Runner | پایپ‌لاین تست‌های واحد</title>
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      direction: rtl;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      color: #58a6ff;
      margin: 0;
    }

    .btn {
      background: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      background: #2ea043;
    }

    .summary-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 24px;
      font-size: 14px;
    }

    .badge-pass { color: #3fb950; font-weight: bold; }
    .badge-fail { color: #f85149; font-weight: bold; }

    .test-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .suite-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
    }

    .suite-header {
      background: #21262d;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 14px;
      color: #f0f6fc;
      direction: ltr;
      text-align: left;
    }

    .test-item {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #21262d;
      font-size: 13px;
      direction: ltr;
      text-align: left;
    }

    .status-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .status-pass { background: rgba(63, 185, 80, 0.2); color: #3fb950; }
    .status-fail { background: rgba(248, 81, 73, 0.2); color: #f85149; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🧪 گزارش زنده اجرای تست‌های فیزیک، برخوردها و لایه‌ها</h1>
      <div style="display: flex; gap: 10px;">
        <button class="btn" id="rerunBtn">اجرای مجدد تست‌ها</button>
        <a href="./index.html" class="btn" style="background: #30363d;">بازگشت به بازی</a>
      </div>
    </header>

    <div class="summary-card">
      <div>کل تست‌ها: <span id="totalTests">0</span></div>
      <div>موفق: <span id="passTests" class="badge-pass">0</span></div>
      <div>ناموفق: <span id="failTests" class="badge-fail">0</span></div>
      <div>مدت زمان: <span id="duration">0 ms</span></div>
    </div>

    <div class="test-list" id="testContainer"></div>
  </div>

  <script type="module">
    import { runPhysicsTests } from '../tests/physics.test.js';
    import { runCollisionTests } from '../tests/collision.test.js';
    import { runLevelTests } from '../tests/level.test.js';

    class BrowserTestRunner {
      constructor() {
        this.suites = [];
        this.currentSuite = null;
        this.passed = 0;
        this.failed = 0;
      }

      describe(suiteName, fn) {
        this.currentSuite = { name: suiteName, tests: [] };
        this.suites.push(this.currentSuite);
        fn();
      }

      test(testName, fn) {
        try {
          fn();
          this.passed++;
          this.currentSuite.tests.push({ name: testName, status: 'PASS' });
        } catch (e) {
          this.failed++;
          this.currentSuite.tests.push({ name: testName, status: 'FAIL', error: e.message });
        }
      }

      assert(cond, msg = 'Assertion failed') {
        if (!cond) throw new Error(msg);
      }

      assertEqual(actual, expected, msg) {
        if (actual !== expected) throw new Error(msg || `Expected ${expected} but got ${actual}`);
      }
    }

    function execute() {
      const runner = new BrowserTestRunner();
      const t0 = performance.now();

      runPhysicsTests(runner);
      runCollisionTests(runner);
      runLevelTests(runner);

      const totalTime = (performance.now() - t0).toFixed(2);

      document.getElementById('totalTests').textContent = runner.passed + runner.failed;
      document.getElementById('passTests').textContent = runner.passed;
      document.getElementById('failTests').textContent = runner.failed;
      document.getElementById('duration').textContent = `${totalTime} ms`;

      const container = document.getElementById('testContainer');
      container.innerHTML = '';

      runner.suites.forEach(suite => {
        const card = document.createElement('div');
        card.className = 'suite-card';

        const head = document.createElement('div');
        head.className = 'suite-header';
        head.textContent = suite.name;
        card.appendChild(head);

        suite.tests.forEach(t => {
          const item = document.createElement('div');
          item.className = 'test-item';
          item.innerHTML = `
            <span>${t.name} ${t.error ? `<br><small style="color:#f85149;">${t.error}</small>` : ''}</span>
            <span class="status-badge ${t.status === 'PASS' ? 'status-pass' : 'status-fail'}">${t.status}</span>
          `;
          card.appendChild(item);
        });

        container.appendChild(card);
      });
    }

    document.getElementById('rerunBtn').addEventListener('click', execute);
    execute();
  </script>
</body>
</html>
