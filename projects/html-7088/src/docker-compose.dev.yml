# ==============================================================================
# B2.st Studio - Local Development & Hot-Reloading Docker Compose
# ==============================================================================
version: '3.8'

services:
  mario-game-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: b2st_mario_web_dev
    restart: always
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=development
    volumes:
      # مانت زنده فایل‌ها برای مشاهده آنی تغییرات کدهای ES6 و Canvas بدون بیلد مجدد
      - ./public:/usr/share/nginx/html:ro
      - ./src:/usr/share/nginx/html/src:ro
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - b2st_dev_net

networks:
  b2st_dev_net:
    driver: bridge